function getCijenuProizvoda(prodId, data) {
  var norm = (data.normativi||[]).find(function(n){return n.prodId===prodId;});
  if(!norm||!norm.stavke||!norm.stavke.length) return null;
  return norm.stavke.reduce(function(s,st){
    var sir = (data.sirovine||[]).find(function(x){return x.id===st.siroId;});
    return s + st.kolicina*(sir ? (sir.cena||0) : 0);
  }, 0);
}

  }, []);

      setFbSt("🔴 TIMEOUT");
      setData(SEED);
      setKor(DEFAULT_KORISNICI);
      setLoad(false);
    }, 15000);

    (async () => {
      try {
        if (!window.__fbReady) throw new Error(window.__fbError || "Firebase nije inicijalizovan");
        setFbSt("🔄 Čitanje podataka...");
        const [d, u] = await Promise.all([fbGet("data"), fbGet("users")]);
        clearTimeout(timeout);
        setData(d || SEED);
        setKor(u || DEFAULT_KORISNICI);
        setFbSt("🟢 Spojeno");
        setLoad(false);
      } catch(e) {
        clearTimeout(timeout);
        console.error("Firebase greška:", e.message);
        setFbSt("🔴 Greška: " + e.message);
        setData(SEED);
        setKor(DEFAULT_KORISNICI);
        setLoad(false);
      }
    })();
  }, []);

  useEffect(() => {
    if (!session) return;
    fbWatch("data",  nd => { if(nd) setData(nd); });
    fbWatch("users", nu => { if(nu) setKor(nu); });
  }, [session]);

  const persist = useCallback(async nd => {
    setSaveSt("💾 Čuvanje...");
    try { await fbSet("data", nd); setData(nd); setSaveSt("✅ Sačuvano"); }
    catch(e) { setSaveSt("❌ Greška!"); }
    setTimeout(() => setSaveSt(""), 2500);
  }, []);

  const persistUsers = useCallback(async nu => { await fbSet("users", nu); setKor(nu); }, []);

  const addLog = (d, action) => ({
    ...d,
    activityLog: [{id:Date.now(),user:session?.ime,uloga:session?.uloga,action,vreme:nowStr()}, ...(d.activityLog||[]).slice(0,199)],
  });

  if (loading) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",background:"#FAF6EE",gap:16,padding:20}}>
      <div style={{fontSize:64, animation: fbSt.includes("🔴") ? "none" : "spin 1.5s linear infinite"}}>🥖</div>
      <p style={{fontFamily:"Georgia,serif",fontSize:20,color:"#C8860A",textAlign:"center"}}>{
        fbSt.includes("🔴") ? "⚠️ Problem sa Firebase" : fbSt
      }</p>
      {(fbSt.includes("🔴") || fbSt.includes("TIMEOUT")) && (
        <div style={{background:"#FFF0F0",border:"2px solid #FFCCCC",borderRadius:16,padding:"20px 24px",maxWidth:380,fontSize:13,color:"#C00000",textAlign:"center",lineHeight:2}}>
          <b style={{fontSize:15}}>❌ Firebase baza nije kreirana!</b><br/>
          <div style={{color:"#333",marginTop:8,lineHeight:1.8}}>
            1. Otvorite <b>console.firebase.google.com</b><br/>
            2. Projekat: <b>mamamantia-73a56</b><br/>
            3. Lijevi meni → <b>Realtime Database</b><br/>
            4. Kliknite <b>"Create Database"</b><br/>
            5. Odaberite <b>Europe</b> → <b>Test mode</b><br/>
            6. Osvježite ovu stranicu
          </div>
        </div>
      )}
      {!fbSt.includes("🔴") && !fbSt.includes("TIMEOUT") && (
        <p style={{fontSize:13,color:"#7A6545"}}>Pokretanje sistema...</p>
      )}
    </div>
  );

  if (!session) return (
    <LoginScreen korisnici={korisnici||DEFAULT_KORISNICI}
      onLogin={(ime,uloga) => { setSess({ime,uloga}); setTab(ULOGE[uloga].lokal?"lokali":"dashboard"); }} />
  );

  const perms   = ULOGE[session.uloga];
  const myLokal = perms.lokal;

  const TABS = [
    {key:"dashboard",  icon:"📊", label:"Dashboard",          roles:["direktor","nadzor"]},
    {key:"dnevnapro",  icon:"👨‍🍳", label:"Dnevna Proizvodnja", roles:["direktor","magacioner","radnik","nadzor"]},
    {key:"dostava",    icon:"🚚", label:"Dostava",             roles:["direktor","magacioner"]},
    {key:"lokali",     icon:"🏪", label:"Stanje Lokala",       roles:["direktor","magacioner","nadzor","prodavac1","prodavac2"]},
    {key:"evidencija", icon:"📋", label:"Evidencija",          roles:["direktor","prodavac1","prodavac2"]},
    {key:"smjena",     icon:"🏁", label:"Zaključak Smjene",    roles:["direktor","prodavac1","prodavac2"]},
    {key:"popis",      icon:"🔢", label:"Popis Zaliha",        roles:["direktor","prodavac1","prodavac2"]},
    {key:"sirovine",   icon:"🌾", label:"Sirovine & Otpremnice", roles:["direktor","magacioner","nadzor"]},
    {key:"troskovi",   icon:"💰", label:"Troškovi",            roles:["direktor","nadzor"]},
    {key:"dobavljaci", icon:"📦", label:"Dobavljači",          roles:["direktor","magacioner","nadzor"]},
    {key:"korisnici",  icon:"🔑", label:"Korisnici & PIN",     roles:["direktor"]},
    {key:"soljica",    icon:"📤", label:"Uvoz iz Šoljice",          roles:["direktor","prodavac1","prodavac2"]},
    {key:"normativi",  icon:"📐", label:"Normativi", roles:["direktor","nadzor"]},
    {key:"proizvodi",  icon:"🛒", label:"Upravljanje Proizvodima", roles:["direktor"]},
    {key:"analitika",  icon:"📈", label:"Analitika & Izvještaji", roles:["direktor","nadzor"]},
    {key:"izvjestaj",  icon:"📄", label:"Periodični Izvještaj",  roles:["direktor","nadzor"]},
    {key:"aktivnost",  icon:"🕐", label:"Aktivnost",           roles:["direktor","magacioner","radnik","nadzor","prodavac1","prodavac2"]},
  ];

  const mojiTabovi = TABS.filter(t => t.roles.includes(session.uloga));
  const validTab   = mojiTabovi.find(t=>t.key===tab) ? tab : mojiTabovi[0]?.key;

  return (
    <div style={{...S.app, background: darkMode?"#111":S.app.background}} className={"mm-app"+(darkMode?" mm-dark":"")}>
      <BottomNav tabs={mojiTabovi} tab={validTab} setTab={setTab} isMobile={isMobile} />
      <Sidebar tabs={mojiTabovi} tab={validTab} setTab={setTab} session={session} perms={perms} fbSt={fbSt} onLogout={()=>setSess(null)} isMobile={isMobile} />
      <div style={{...S.main, filter: darkMode?"invert(1) hue-rotate(180deg)":"none"}}>
        <TopBar tab={validTab} tabs={TABS} saveSt={saveSt} session={session} perms={perms} myLokal={myLokal} darkMode={darkMode} setDarkMode={setDarkMode} isMobile={isMobile} />
        <div style={{...S.content, paddingBottom:isMobile?"80px":"18px"}} className="mm-content">
          {validTab==="dashboard"  && <Dashboard   data={data} />}
          {validTab==="dnevnapro"  && <DnevnaProizvodnja data={data} persist={persist} session={session} addLog={addLog} />}
          {validTab==="dostava"    && <Dostava     data={data} persist={persist} perms={perms} session={session} addLog={addLog} />}
          {validTab==="lokali"     && <StanjeLokala data={data} myLokal={myLokal} />}
          {validTab==="evidencija" && <Evidencija  data={data} persist={persist} session={session} myLokal={myLokal} addLog={addLog} />}
          {validTab==="popis"      && <Popis       data={data} persist={persist} session={session} myLokal={myLokal} addLog={addLog} />}
          {validTab==="smjena"     && <ZaklucakSmjene data={data} persist={persist} session={session} myLokal={myLokal} addLog={addLog} />}
          {validTab==="sirovine"   && <SirovineOtpremnice data={data} persist={persist} perms={perms} session={session} addLog={addLog} />}
          {validTab==="troskovi"   && <Troskovi    data={data} persist={persist} perms={perms} />}
          {validTab==="dobavljaci" && <Dobavljaci  data={data} persist={persist} perms={perms} session={session} addLog={addLog} />}
          {validTab==="korisnici"  && <KorisniciTab korisnici={korisnici} persistUsers={persistUsers} />}
          {validTab==="soljica"    && <UvozSoljica data={data} persist={persist} session={session} myLokal={myLokal} addLog={addLog} />}
          {validTab==="normativi"  && <Normativi data={data} persist={persist} session={session} addLog={addLog} />}
          {validTab==="proizvodi"  && <UpravljanjeProizvodima data={data} persist={persist} />}
          {validTab==="analitika"  && <Analitika   data={data} />}
          {validTab==="izvjestaj" && <PeriodIzvjestaj data={data} />}
          {validTab==="aktivnost"  && <Aktivnost   data={data} session={session} />}
          {session.uloga==="direktor" && <AdminPanel data={data} persist={persist} addLog={addLog} session={session} korisnici={korisnici}/>}
        </div>
      </div>
    </div>
  );
}

// ── LOGIN ─────────────────────────────────────────────────────────
function LoginScreen({ korisnici, onLogin }) {
  const [ime,setIme]=useState(""); const [pin,setPin]=useState(""); const [err,setErr]=useState("");
  const go=()=>{
    const k=korisnici.find(k=>k.ime.toLowerCase()===ime.trim().toLowerCase()&&k.pin===pin);
    if(k) onLogin(k.ime,k.uloga);
    else { setErr("Pogrešan PIN!"); setPin(""); }
  };
  const addDigit = d => { if(pin.length<6){ const np=pin+d; setPin(np); setErr(""); if(np.length===4||np.length===6){ const k=korisnici.find(k=>k.ime.toLowerCase()===ime.trim().toLowerCase()&&k.pin===np); if(k) onLogin(k.ime,k.uloga); else if(np.length>=4) { setErr("Pogrešan PIN!"); setTimeout(()=>setPin(""),400); } } } };
  const delDigit = () => { setPin(p=>p.slice(0,-1)); setErr(""); };

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0F0E0B 0%,#1C1A17 50%,#2A2318 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#FAF6EE",borderRadius:24,padding:"32px 28px",borderTop:"4px solid #E8A020",maxWidth:400,width:"100%",boxShadow:"0 24px 80px rgba(0,0,0,.6)"}}>
        <div style={{textAlign:"center",marginBottom:20}}>
          <div style={{display:"inline-flex",flexDirection:"column",alignItems:"center",justifyContent:"center",width:120,height:120,borderRadius:"50%",background:"linear-gradient(135deg,#1C1A17,#2A2318)",border:"3px solid #E8A020",position:"relative",overflow:"hidden",marginBottom:12}}>
            <div style={{position:"absolute",inset:0,backgroundImage:"repeating-linear-gradient(45deg,rgba(232,160,32,.06) 0px,rgba(232,160,32,.06) 9px,transparent 9px,transparent 18px)"}}/>
            <div style={{position:"relative",zIndex:1,textAlign:"center",lineHeight:1}}>
              <div style={{fontFamily:"Georgia,'Times New Roman',serif",fontSize:21,fontWeight:700,color:"#E8A020",letterSpacing:1}}>mama</div>
              <svg width="90" height="22" viewBox="0 0 90 22" style={{display:"block",margin:"4px auto"}}>
                <rect x="0" y="7" width="14" height="8" rx="4" fill="#C8860A"/>
                <rect x="2" y="9" width="10" height="4" rx="2" fill="#E8A020"/>
                <rect x="13" y="4" width="64" height="14" rx="7" fill="#C8860A"/>
                <rect x="15" y="6" width="60" height="10" rx="5" fill="#E8A020"/>
                <rect x="76" y="7" width="14" height="8" rx="4" fill="#C8860A"/>
                <rect x="78" y="9" width="10" height="4" rx="2" fill="#E8A020"/>
                <rect x="28" y="2" width="2" height="18" rx="1" fill="rgba(255,255,255,.15)"/>
                <rect x="44" y="2" width="2" height="18" rx="1" fill="rgba(255,255,255,.15)"/>
                <rect x="60" y="2" width="2" height="18" rx="1" fill="rgba(255,255,255,.15)"/>
              </svg>
              <div style={{fontFamily:"Georgia,'Times New Roman',serif",fontSize:21,fontWeight:700,color:"#E8A020",letterSpacing:1}}>mantia</div>
            </div>
          </div>
          <div style={{fontSize:13,color:"#7A6545"}}>Sistem upravljanja</div>
        </div>

        {/* Odabir korisnika */}
        {!ime ? (
          <div>
            <div style={{fontSize:12,color:"#7A6545",fontWeight:700,marginBottom:10,textAlign:"center",textTransform:"uppercase",letterSpacing:.5}}>Odaberi korisnika</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {korisnici.map(k=>{const u=ULOGE[k.uloga];const lok=u?.lokal?LOKALI[u.lokal]:null;return(
                <button key={k.id} onClick={()=>{setIme(k.ime);setPin("");setErr("");}}
                  style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",borderRadius:12,border:"1px solid #E8DECA",background:"white",cursor:"pointer",textAlign:"left",width:"100%"}}>
                  <span style={{fontSize:22}}>{u?.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:14,color:"#1C1A17"}}>{k.ime}</div>
                    <div style={{fontSize:11,color:"#7A6545"}}>{u?.naziv}{lok?" · "+lok.naziv:""}</div>
                  </div>
                  <span style={{color:"#C8A050",fontSize:18}}>›</span>
                </button>
              );})}
            </div>
          </div>
        ) : (
          <div>
            {/* Odabrani korisnik */}
            <button onClick={()=>{setIme("");setPin("");setErr("");}}
              style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,background:"#F0EBE0",border:"none",borderRadius:10,padding:"8px 14px",cursor:"pointer",width:"100%"}}>
              <span style={{fontSize:20}}>{ULOGE[korisnici.find(k=>k.ime===ime)?.uloga]?.icon}</span>
              <span style={{fontWeight:700,fontSize:14,color:"#1C1A17",flex:1,textAlign:"left"}}>{ime}</span>
              <span style={{fontSize:12,color:"#7A6545"}}>← Promijeni</span>
            </button>

            {/* PIN prikaz */}
            <div style={{display:"flex",justifyContent:"center",gap:12,marginBottom:20}}>
              {[0,1,2,3].map(i=>(
                <div key={i} style={{width:16,height:16,borderRadius:"50%",
                  background:pin.length>i?"#1C1A17":"transparent",
                  border:"2px solid "+(pin.length>i?"#1C1A17":"#C8A050"),
                  transition:"background .15s"}}/>
              ))}
            </div>

            {err&&<div style={{background:"#FFF0F0",border:"1px solid #FFCCCC",borderRadius:10,padding:"8px 12px",fontSize:13,color:"#C00000",fontWeight:700,textAlign:"center",marginBottom:12}}>{err}</div>}

            {/* Numpad */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
              {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d,i)=>(
                <button key={i} onClick={()=>d==="⌫"?delDigit():d!==""?addDigit(String(d)):null}
                  disabled={d===""}
                  style={{padding:"16px 0",borderRadius:14,border:"1px solid #E8DECA",
                    background:d==="⌫"?"#FFF0F0":d===""?"transparent":"white",
                    color:d==="⌫"?"#C00000":"#1C1A17",
                    fontSize:d==="⌫"?20:22,fontWeight:700,cursor:d===""?"default":"pointer",
                    boxShadow:d!==""&&d!=="⌫"?"0 2px 6px rgba(0,0,0,.08)":"none",
                    transition:"background .1s"}}>
                  {d}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function BottomNav({tabs, tab, setTab, isMobile}) {
  const [showAll, setShowAll] = React.useState(false);
  const navSwipeX = React.useRef(0);
  if(!isMobile) return null;

  // Prvih 4 najbitnija + "Više" dugme
  const glavni = tabs.slice(0, 4);
  const ostali = tabs.slice(4);
  const activeInOstali = ostali.find(t=>t.key===tab);

  const NavBtn = ({t, onClick}) => (
    <button onClick={onClick||(() => setTab(t.key))} style={{
      flex:1, padding:"8px 2px 10px", border:"none",
      background:tab===t.key?"rgba(232,160,32,.18)":"transparent",
      color:tab===t.key?"#E8A020":"rgba(255,255,255,.55)",
      cursor:"pointer", display:"flex", flexDirection:"column",
      alignItems:"center", gap:2,
      borderTop: tab===t.key?"2px solid #E8A020":"2px solid transparent",
      minWidth:0
    }}>
      <span style={{fontSize:20}}>{t.icon}</span>
      <span style={{fontSize:9,fontWeight:tab===t.key?700:400,lineHeight:1,textAlign:"center",maxWidth:52,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
        {t.label.split(" ")[0]}
      </span>
    </button>
  );

  return (
    <>
      {/* Drawer sa svim tabovima */}
      {showAll && (
        <div onClick={()=>setShowAll(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:998}}/>
      )}
      {showAll && (
        <div style={{position:"fixed",bottom:64,left:0,right:0,zIndex:999,
          background:"#1C1A17",borderTop:"2px solid #E8A020",borderRadius:"20px 20px 0 0",
          padding:"16px 8px 8px",boxShadow:"0 -8px 30px rgba(0,0,0,.5)"}}>
          <div style={{textAlign:"center",color:"rgba(255,255,255,.4)",fontSize:11,marginBottom:12,fontWeight:600,textTransform:"uppercase",letterSpacing:1}}>
            Svi moduli
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4}}>
            {tabs.map(t=>(
              <button key={t.key} onClick={()=>{setTab(t.key);setShowAll(false);}} style={{
                padding:"12px 6px",border:"none",borderRadius:10,
                background:tab===t.key?"rgba(232,160,32,.2)":"rgba(255,255,255,.05)",
                color:tab===t.key?"#E8A020":"rgba(255,255,255,.7)",
                cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4,
                border:tab===t.key?"1px solid #E8A020":"1px solid transparent"
              }}>
                <span style={{fontSize:22}}>{t.icon}</span>
                <span style={{fontSize:10,fontWeight:600,lineHeight:1.2,textAlign:"center"}}>{t.label}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Fiksni bottom nav */}
      <nav style={{
        display:"flex", position:"fixed", bottom:0, left:0, right:0, zIndex:999,
        background:"#1C1A17", borderTop:"2px solid #E8A020",
        boxShadow:"0 -4px 20px rgba(0,0,0,.5)",
        paddingBottom:"env(safe-area-inset-bottom,0px)"
      }}
        onTouchStart={e=>{ navSwipeX.current=e.touches[0].clientX; }}
        onTouchEnd={e=>{
          const dx=e.changedTouches[0].clientX - navSwipeX.current;
          if(Math.abs(dx)<50) return;
          setTab(prev=>{
            const keys=tabs.map(t=>t.key);
            const ci=keys.indexOf(prev);
            if(dx<0 && ci<keys.length-1) return keys[ci+1];
            if(dx>0 && ci>0) return keys[ci-1];
            return prev;
          });
        }}
      >
        {glavni.map(t=><NavBtn key={t.key} t={t}/>)}
        {/* Više dugme */}
        <button onClick={()=>setShowAll(s=>!s)} style={{
          flex:1, padding:"8px 2px 10px", border:"none",
          background:activeInOstali||showAll?"rgba(232,160,32,.18)":"transparent",
          color:activeInOstali||showAll?"#E8A020":"rgba(255,255,255,.55)",
          cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:2,
          borderTop: showAll?"2px solid #E8A020":"2px solid transparent"
        }}>
          <span style={{fontSize:20}}>{showAll?"✕":"☰"}</span>
          <span style={{fontSize:9,fontWeight:600,lineHeight:1}}>
            {activeInOstali ? activeInOstali.icon : "Više"}
          </span>
        </button>
      </nav>
    </>
  );
}

        </div>
        {!col&&<div style={{background:"rgba(255,255,255,.1)",borderRadius:8,padding:"7px 10px",marginTop:10}}>

          <div style={{color:fbSt.includes("🟢")?"#86efac":"#fca5a5",fontSize:9,marginTop:4}}>{fbSt}</div>
        </div>}
      </div>
      <nav style={{padding:"10px 6px",flex:1,overflowY:"auto"}}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)} title={t.label} style={{width:"100%",padding:col?"10px":"10px 12px",borderRadius:8,border:"none",background:tab===t.key?"rgba(255,255,255,.14)":"transparent",color:tab===t.key?"#E8D5A0":"rgba(255,255,255,.6)",cursor:"pointer",display:"flex",alignItems:"center",gap:9,fontSize:13,fontWeight:tab===t.key?700:400,marginBottom:2,borderLeft:`3px solid ${tab===t.key?"#E8A020":"transparent"}`}}>
            <span style={{fontSize:16,flexShrink:0}}>{t.icon}</span>{!col&&t.label}
          </button>
        ))}
      </nav>
      <div style={{padding:"10px 8px",borderTop:"1px solid rgba(255,255,255,.08)"}}>
        <button onClick={onLogout} title="Odjavi se" style={{width:"100%",padding:col?"10px":"9px 12px",borderRadius:8,border:"none",background:"rgba(255,60,60,.12)",color:"rgba(255,160,160,.8)",cursor:"pointer",display:"flex",alignItems:"center",gap:8,fontSize:12,fontWeight:600}}>
          <span>🚪</span>{!col&&"Odjavi se"}
        </button>
      </div>
    </aside>
  );
}

// ── TOPBAR ────────────────────────────────────────────────────────
function TopBar({tab,tabs,saveSt,session,perms,myLokal,darkMode,setDarkMode,isMobile}) {
  const t=tabs.find(x=>x.key===tab); const lok=myLokal?LOKALI[myLokal]:null;
  return (
    <header style={S.topbar} className="mm-topbar">
      <h1 style={{margin:0,fontSize:isMobile?15:18,fontFamily:"Georgia,serif",color:"#1C1A17",flex:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t?.icon} {t?.label}</h1>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        {saveSt&&<span style={{fontSize:12,color:saveSt.includes("✅")?"#107C41":saveSt.includes("❌")?"#C00000":"#A07010",fontWeight:700}}>{saveSt}</span>}
        {lok&&<Tag bg={lok.bg} color={lok.boja}>{lok.icon} {lok.naziv}</Tag>}
        {!isMobile&&<Tag bg="#FAF6EE" color="#C8860A">{perms.icon} {session.ime}</Tag>}
        <button onClick={()=>setDarkMode(d=>!d)}
          style={{background:darkMode?"#1C1A17":"#F0EBE0",border:"1.5px solid "+(darkMode?"#E8A020":"#C8A050"),
            borderRadius:20,padding:isMobile?"6px 8px":"5px 13px",cursor:"pointer",
            display:"flex",alignItems:"center",gap:4,
            color:darkMode?"#E8A020":"#5A4A35",fontWeight:700,fontSize:12}}>
          {darkMode?"☀️":"🌙"}{!isMobile&&(darkMode?" Svijetlo":" Tamno")}
        </button>
        <div style={{width:8,height:8,borderRadius:"50%",background:"#4CAF50"}}/>
      </div>

    const arr=Object.entries(stavke).filter(([,v])=>+v>0).map(([id,kol])=>({prodId:id,kolicina:+kol}));

    arr.forEach(st=>{ns=ns.map(s=>s.prodId===st.prodId&&s.lokacija==="proizvodnja"?{...s,kolicina:s.kolicina+st.kolicina}:s);});

      </Modal>}

  );

// ── DOSTAVA ───────────────────────────────────────────────────────
function Dostava({data,persist,perms,session,addLog}) {
  const [show,setShow]=useState(false); const [selLok,setSelL]=useState("mama1"); const [stavke,setSt]=useState({});
  const startNew=()=>{const st={};getSviP(data).filter(p=>!p.direktna).forEach(p=>{st[p.id]="";});setSt(st);setShow(true);};
  const save=()=>{
    const arr=Object.entries(stavke).filter(([,v])=>+v>0).map(([id,kol])=>({prodId:id,kolicina:+kol}));
    if(!arr.length){alert("Unesite barem jednu količinu!");return;}
    for(const st of arr){const pr=(data.stanjeLokala||[]).find(s=>s.prodId===st.prodId&&s.lokacija==="proizvodnja");if(!pr||pr.kolicina<st.kolicina){const p=getSviP(data).find(x=>x.id===st.prodId);alert(`Nema dovoljno "${p?.naziv}"! Dostupno: ${pr?.kolicina||0}`);return;}}
    const lok=LOKALI[selLok]; let ns=[...(data.stanjeLokala||[])];
    arr.forEach(st=>{ns=ns.map(s=>s.prodId===st.prodId&&s.lokacija==="proizvodnja"?{...s,kolicina:s.kolicina-st.kolicina}:s.prodId===st.prodId&&s.lokacija===selLok?{...s,kolicina:s.kolicina+st.kolicina}:s);});
    // Odbitak sirovina po normativima
    var nsS=[...(data.sirovine||[])];
    var novKret=[...(data.kretanja||[])];
    var nKrId=data.nextId.kretanja||1;
    arr.forEach(function(st){
      var norm=(data.normativi||[]).find(function(n){return n.prodId===st.prodId;});
      if(!norm) return;
      norm.stavke.forEach(function(nst){
        var potr=nst.kolicina*st.kolicina;
        nsS=nsS.map(function(s){return s.id===nst.siroId?{...s,kolicina:Math.max(0,(s.kolicina||0)-potr)}:s;});
        novKret.push({id:nKrId++,siroId:nst.siroId,naziv:nst.naziv,vrsta:"IZLAZ",kolicina:potr,cena:0,datum:today(),napomena:"Auto normativ"});
      });
    });
    persist(addLog({...data,stanjeLokala:ns,sirovine:nsS,kretanja:novKret,
      dostave:[{id:data.nextId.dostave,lokacija:selLok,lokNaziv:lok.naziv,datum:today(),vreme:nowStr(),stavke:arr,korisnik:session.ime},...(data.dostave||[])],
      nextId:{...data.nextId,dostave:data.nextId.dostave+1,kretanja:nKrId}},
      "Dostava u "+lok.naziv+": "+arr.reduce(function(s,x){return s+x.kolicina;},0)+" kom"));
    setShow(false);
  };
  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      {perms.canDeliver&&<div><Btn icon="🚚" label="Nova Dostava u Lokal" onClick={startNew} color="#C8860A"/></div>}
      <Card title="🏭 Stanje u Proizvodnji">
        {getKat(data).filter(k=>!k.direktna).map(kat=>{
          const items=kat.proizvodi.map(p=>({...p,pro:(data.stanjeLokala||[]).find(s=>s.prodId===p.id&&s.lokacija==="proizvodnja")?.kolicina||0,m1:(data.stanjeLokala||[]).find(s=>s.prodId===p.id&&s.lokacija==="mama1")?.kolicina||0,m2:(data.stanjeLokala||[]).find(s=>s.prodId===p.id&&s.lokacija==="mama2")?.kolicina||0}));
          return(<div key={kat.id} style={{marginBottom:14}}><div style={{fontWeight:700,fontSize:12,color:kat.boja,marginBottom:6}}>{kat.icon} {kat.naziv}</div>
            <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{background:"#C8860A"}}>{["Naziv","Proizvodnja","Mama 1","Mama 2"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>{items.map((p,i)=><tr key={p.id} style={{background:i%2===0?"white":"#FAF6EE"}}><td style={{...S.td,fontWeight:600}}>{p.naziv}</td><td style={{...S.td,textAlign:"center",fontWeight:800,fontSize:15,color:p.pro===0?"#C00000":p.pro<5?"#F57F17":"#107C41"}}>{fmtN(p.pro)}</td><td style={{...S.td,textAlign:"center",fontWeight:700,color:"#107C41"}}>{fmtN(p.m1)}</td><td style={{...S.td,textAlign:"center",fontWeight:700,color:"#1D4ED8"}}>{fmtN(p.m2)}</td></tr>)}</tbody>
            </table></div></div>);
        })}
      </Card>
      <DostavaHistorija data={data} persist={persist} perms={perms} session={session} addLog={addLog}/>
      {show&&<Modal title="🚚 Nova Dostava iz Proizvodnje" onClose={()=>setShow(false)}>
        <div style={{marginBottom:14}}><label style={S.label}>Odredišni Lokal</label><div style={{display:"flex",gap:10}}>{["mama1","mama2"].map(l=>{const li=LOKALI[l];return<button key={l} onClick={()=>setSelL(l)} style={{flex:1,padding:"12px",borderRadius:10,border:`2px solid ${selLok===l?li.boja:"#E0D5BE"}`,background:selLok===l?li.bg:"white",color:li.boja,fontWeight:700,cursor:"pointer",fontSize:14}}>{li.icon} {li.naziv}</button>;})}</div></div>
        <div style={{maxHeight:360,overflowY:"auto",display:"flex",flexDirection:"column",gap:12,marginBottom:14}}>
          {getKat(data).filter(k=>!k.direktna).map(kat=>(
            <div key={kat.id}><div style={{fontWeight:700,fontSize:12,color:kat.boja,marginBottom:5}}>{kat.icon} {kat.naziv}</div>
              {kat.proizvodi.map(p=>{const d=(data.stanjeLokala||[]).find(s=>s.prodId===p.id&&s.lokacija==="proizvodnja")?.kolicina||0;return<div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 12px",background:d<1?"#FFF0F0":"#FEFCF5",borderRadius:8,border:"1px solid #E8DECA",marginBottom:4}}><div style={{flex:1,fontSize:13,fontWeight:600}}>{p.naziv}</div><span style={{fontSize:11,color:d<1?"#C00000":"#7A6545",width:65,textAlign:"right"}}>dost: <b>{d}</b></span><input type="number" min="0" max={d} value={stavke[p.id]||""} onChange={e=>setSt(f=>({...f,[p.id]:e.target.value}))} disabled={d<1} style={{...S.input,width:75,textAlign:"right",background:d<1?"#F5F5F5":"white"}} placeholder="0"/></div>;})}
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:10}}><Btn icon="🚚" label="Potvrdi Dostavu" onClick={save} color="#C8860A" full/><Btn icon="✕" label="Otkaži" onClick={()=>setShow(false)} color="#7A6545" full/></div>
      </Modal>}
    </div>
  );
}


// ── DOSTAVA HISTORIJA (sa Storno opcijom) ─────────────────────────
function DostavaHistorija({data,persist,perms,session,addLog}) {
  const [expanded,setExp] = useState(null);
  const [confirmId,setConfId] = useState(null);

  const stornoDostaву = (d) => {
    const lok = LOKALI[d.lokacija];
    // Vraća robu nazad u Proizvodnju, skida iz lokala
    let ns = [...(data.stanjeLokala||[])];
    d.stavke.forEach(st => {
      ns = ns.map(s =>
        s.prodId===st.prodId && s.lokacija==="proizvodnja" ? {...s, kolicina:s.kolicina+st.kolicina} :
        s.prodId===st.prodId && s.lokacija===d.lokacija    ? {...s, kolicina:Math.max(0,s.kolicina-st.kolicina)} :
        s
      );
    });
    const ukupno = d.stavke.reduce((s,x)=>s+x.kolicina,0);
    persist(addLog(
      {...data, stanjeLokala:ns, dostave:(data.dostave||[]).filter(x=>x.id!==d.id)},
      `STORNO dostave u ${lok.naziv}: −${ukupno} kom (vratio ${session.ime})`
    ));
    setConfId(null);
  };

  const dostave = data.dostave||[];

  return (
    <Card title="📋 Historija Dostava">
      {dostave.length===0
        ? <p style={{color:"#7A6545",fontSize:13,textAlign:"center",padding:20}}>Nema dostava.</p>
        : dostave.slice(0,30).map((d,i) => {
            const lok = LOKALI[d.lokacija];
            const ukupno = d.stavke.reduce((s,x)=>s+x.kolicina,0);
            const isExp = expanded===d.id;
            const isConf = confirmId===d.id;
            const isDanas = d.datum===today();
            return (
              <div key={d.id} style={{marginBottom:8,borderRadius:10,border:`1px solid ${isExp?"#C8860A":"#E8DECA"}`,overflow:"hidden",background:"white"}}>
                {/* Main row */}
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:isExp?"#FFF8DC":"white"}}>
                  <div style={{flex:1,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",cursor:"pointer"}} onClick={()=>setExp(isExp?null:d.id)}>
                    <Tag bg={lok.bg} color={lok.boja}>{lok.icon} {lok.naziv}</Tag>
                    <span style={{fontSize:12,color:"#7A6545"}}>{d.datum}</span>
                    <span style={{fontWeight:700,fontSize:14,color:"#1C1A17"}}>{fmtN(ukupno)} kom</span>
                    <span style={{fontSize:11,color:"#9A8A75"}}>{d.korisnik}</span>
                    {!isDanas&&<Tag bg="#F5F5F5" color="#999">⏰ Starija</Tag>}
                  </div>
                  <button onClick={()=>setExp(isExp?null:d.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#C8A050",fontSize:16,padding:"2px 6px"}}>{isExp?"▲":"▼"}</button>
                  {/* Storno — samo direktor ili magacioner, i samo dostave od danas */}
                  {(perms.canDelete||(isDanas&&perms.canDeliver)) && (
                    <button onClick={()=>setConfId(isConf?null:d.id)}
                      style={{padding:"6px 12px",borderRadius:8,border:"1px solid #FFCCCC",background:isConf?"#FFF0F0":"white",color:"#C00000",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>
                      ↺ Storno
                    </button>
                  )}
                </div>

                {/* Confirm storno */}
                {isConf&&(
                  <div style={{background:"#FFF0F0",borderTop:"1px solid #FFCCCC",padding:"12px 16px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                    <div style={{flex:1,fontSize:13,color:"#C00000"}}>
                      <b>⚠️ Storno dostave?</b> Roba se vraća nazad u Proizvodnju.<br/>
                      <span style={{fontSize:11,color:"#999"}}>Ovo ne može da se poništi!</span>
                    </div>
                    <button onClick={()=>stornoDostaву(d)} style={{background:"#C00000",color:"white",border:"none",borderRadius:8,padding:"8px 18px",fontWeight:700,cursor:"pointer",fontSize:13}}>✅ Da, storniraj</button>
                    <button onClick={()=>setConfId(null)} style={{background:"#eee",color:"#333",border:"none",borderRadius:8,padding:"8px 14px",cursor:"pointer",fontSize:13}}>Otkaži</button>
                  </div>
                )}

                {/* Expanded details */}
                {isExp&&(
                  <div style={{borderTop:"1px solid #F0E6D8",padding:"10px 16px",background:"#FFFDF8"}}>
                    <div style={{fontSize:11,color:"#9A8A75",fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Detalji dostave — {d.vreme}</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:6}}>
                      {d.stavke.map(st=>{
                        const p = getSviP(data).find(x=>x.id===st.prodId);
                        return(
                          <div key={st.prodId} style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",background:"white",borderRadius:7,border:"1px solid #EEE2D0",fontSize:12}}>
                            <span style={{color:"#1C1A17"}}>{p?.naziv||st.prodId}</span>
                            <span style={{fontWeight:800,color:"#C8860A"}}>{fmtN(st.kolicina)}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            );
          })
      }
    </Card>
  );
}

// ── STANJE LOKALA ─────────────────────────────────────────────────
function StanjeLokala({data,myLokal}) {
  const lokovi=myLokal&&myLokal!=="proizvodnja"?[myLokal]:["mama1","mama2","proizvodnja"];
  return (
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      {lokovi.map(lok=>{
        const info=LOKALI[lok]; const items=(data.stanjeLokala||[]).filter(s=>s.lokacija===lok); const ukupK=items.reduce((s,x)=>s+x.kolicina,0);
        return(<Card key={lok} title={`${info.icon} ${info.naziv}`}>
          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div style={{background:info.bg,borderRadius:10,padding:"10px 14px",border:`1px solid ${info.boja}22`,display:"flex",gap:8,alignItems:"center"}}><span>📦</span><div><div style={{fontWeight:800,color:info.boja,fontSize:15}}>{fmtN(ukupK)}</div><div style={{fontSize:11,color:"#5A4A35"}}>kom ukupno</div></div></div>
          </div>
          {getKat(data).map(kat=>{
            const katItems=kat.proizvodi.map(p=>({...p,kolicina:items.find(s=>s.prodId===p.id)?.kolicina||0}));
            return(<div key={kat.id} style={{marginBottom:14}}><div style={{fontWeight:700,fontSize:12,color:kat.boja,marginBottom:6,display:"flex",alignItems:"center",gap:6}}>{kat.icon} {kat.naziv}{kat.direktna&&<Tag bg="#E8F5E9" color="#107C41">📥 Direktna</Tag>}</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:7}}>
                {katItems.map(p=>{const st=p.kolicina===0||p.kolicina<3?"LOW":p.kolicina<8?"MID":"OK";const cl=st==="LOW"?{bg:"#FFF0F0",c:"#C00000",b:"#FFCCCC"}:st==="MID"?{bg:"#FFF8DC",c:"#C8860A",b:"#FFE082"}:{bg:"#F9F5F0",c:"#1C1A17",b:"#E5D8BC"};return<div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:cl.bg,borderRadius:8,border:`1px solid ${cl.b}`}}><span style={{fontSize:12,color:"#1C1A17",marginRight:6}}>{p.naziv}</span><span style={{fontWeight:800,fontSize:17,color:cl.c,flexShrink:0}}>{fmtN(p.kolicina)}</span></div>;})}
              </div></div>);
          })}
        </Card>);
      })}
    </div>
  );
}

// ── EVIDENCIJA ────────────────────────────────────────────────────
function Evidencija({data,persist,session,myLokal,addLog}) {
  const [show,setShow]=useState(false); const [tip,setTip]=useState("REFUZ"); const [selLok,setSelL]=useState(myLokal&&myLokal!=="proizvodnja"?myLokal:"mama1"); const [stavke,setSt]=useState({});
  const TIPOVI={REFUZ:{label:"Refuz",icon:"↩️",opis:"Roba vraćena — smanjuje stanje",boja:"#F57F17",bg:"#FFF8DC",delta:-1,katFilter:k=>!k.direktna},SKART:{label:"Škart",icon:"🗑️",opis:"Bačeno/isteklo — smanjuje stanje",boja:"#C00000",bg:"#FFF0F0",delta:-1,katFilter:()=>true},PRIJEM_DIREKTNO:{label:"Prijem Direktno",icon:"📥",opis:"Pića od dobavljača — povećava stanje",boja:"#107C41",bg:"#E8F5E9",delta:+1,katFilter:k=>k.direktna},HRANA:{label:"Hrana Uposljenika",icon:"🍽️",opis:"Pojeli uposljenici — smanjuje stanje",boja:"#6A1B9A",bg:"#F3E5F5",delta:-1,katFilter:k=>!k.direktna}};
  const startNew=t=>{setTip(t);const st={};getKat(data).filter(TIPOVI[t].katFilter).forEach(k=>k.proizvodi.forEach(p=>{st[p.id]="";}));setSt(st);setShow(true);};
  const save=()=>{
    const tI=TIPOVI[tip]; const arr=Object.entries(stavke).filter(([,v])=>+v>0).map(([id,kol])=>({prodId:id,kolicina:+kol}));
    if(!arr.length){alert("Unesite barem jednu količinu!");return;}
    if(tI.delta<0){for(const st of arr){const cur=(data.stanjeLokala||[]).find(s=>s.prodId===st.prodId&&s.lokacija===selLok);if((cur?.kolicina||0)<st.kolicina){const p=getSviP(data).find(x=>x.id===st.prodId);alert(`Nema dovoljno "${p?.naziv}"! Dostupno: ${cur?.kolicina||0}`);return;}}}
    let ns=[...(data.stanjeLokala||[])];
    arr.forEach(st=>{ns=ns.map(s=>s.prodId===st.prodId&&s.lokacija===selLok?{...s,kolicina:Math.max(0,s.kolicina+(tI.delta*st.kolicina))}:s);});
    const lok=LOKALI[selLok]; const zapisi=arr.map((st,idx)=>{const p=getSviP(data).find(x=>x.id===st.prodId);return{id:data.nextId.evidencija+idx,tip,lokacija:selLok,lokNaziv:lok.naziv,prodId:st.prodId,prodNaziv:p?.naziv||"?",kolicina:st.kolicina,datum:today(),vreme:nowStr(),korisnik:session.ime};});
    persist(addLog({...data,stanjeLokala:ns,evidencija:[...zapisi,...(data.evidencija||[])],nextId:{...data.nextId,evidencija:data.nextId.evidencija+zapisi.length}},`${tI.label} u ${lok.naziv}: ${arr.reduce((s,x)=>s+x.kolicina,0)} kom`));
    setShow(false);
  };
  const danasEv=(data.evidencija||[]).filter(e=>e.datum===today()); const lokovi=myLokal&&myLokal!=="proizvodnja"?[myLokal]:["mama1","mama2"]; const tI=tip?TIPOVI[tip]:null;
  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{Object.entries(TIPOVI).map(([k,t])=><button key={k} onClick={()=>startNew(k)} style={{padding:"11px 18px",borderRadius:10,border:`2px solid ${t.boja}`,background:t.bg,color:t.boja,fontWeight:700,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",gap:7}}>{t.icon} {t.label}</button>)}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:12}}>
        {Object.entries(TIPOVI).map(([k,t])=>{const uk=danasEv.filter(e=>e.tip===k).reduce((s,e)=>s+e.kolicina,0);return<div key={k} style={{background:t.bg,borderRadius:12,padding:"14px 16px",border:`1px solid ${t.boja}22`}}><div style={{fontSize:20}}>{t.icon}</div><div style={{fontFamily:"Georgia,serif",fontSize:24,fontWeight:800,color:t.boja,margin:"4px 0"}}>{fmtN(uk)}</div><div style={{fontSize:11,color:"#5A4A35",fontWeight:600}}>{t.label} Danas</div></div>;})}
      </div>
      <Card title="📋 Evidencija">
        {(data.evidencija||[]).length===0?<p style={{color:"#7A6545",fontSize:13,textAlign:"center",padding:20}}>Nema evidencije.</p>:<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{background:"#C8860A"}}>{["Datum","Lokal","Tip","Artikal","Kol.","Ko"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>{(data.evidencija||[]).slice(0,80).map((e,i)=>{const t=TIPOVI[e.tip];const lok=LOKALI[e.lokacija];return<tr key={e.id} style={{background:i%2===0?"white":"#FAF6EE"}}><td style={S.td}>{e.datum}</td><td style={S.td}><Tag bg={lok?.bg||"#F5F5F5"} color={lok?.boja||"#333"}>{lok?.icon}</Tag></td><td style={S.td}><Tag bg={t?.bg||"#F5F5F5"} color={t?.boja||"#333"}>{t?.icon} {t?.label||e.tip}</Tag></td><td style={{...S.td,fontWeight:600}}>{e.prodNaziv}</td><td style={{...S.td,textAlign:"right",fontWeight:700}}>{fmtN(e.kolicina)}</td><td style={S.td}>{e.korisnik}</td></tr>;})}
        </tbody></table></div>}
      </Card>
      {show&&tI&&<Modal title={`${tI.icon} ${tI.label}`} onClose={()=>setShow(false)}>
        <div style={{background:tI.bg,borderRadius:10,padding:"10px 14px",fontSize:12,color:tI.boja,fontWeight:600,marginBottom:14}}>{tI.opis}</div>
        {lokovi.length>1&&<div style={{marginBottom:14}}><label style={S.label}>Lokal</label><div style={{display:"flex",gap:8}}>{lokovi.map(l=>{const li=LOKALI[l];return<button key={l} onClick={()=>setSelL(l)} style={{flex:1,padding:"10px",borderRadius:10,border:`2px solid ${selLok===l?li.boja:"#E0D5BE"}`,background:selLok===l?li.bg:"white",color:li.boja,fontWeight:700,cursor:"pointer",fontSize:13}}>{li.icon} {li.naziv}</button>;})}</div></div>}
        <div style={{maxHeight:390,overflowY:"auto",display:"flex",flexDirection:"column",gap:11,marginBottom:14}}>
          {getKat(data).filter(tI.katFilter).map(kat=>(
            <div key={kat.id}><div style={{fontWeight:700,fontSize:12,color:kat.boja,marginBottom:5}}>{kat.icon} {kat.naziv}</div>
              {kat.proizvodi.map(p=>{const cur=(data.stanjeLokala||[]).find(s=>s.prodId===p.id&&s.lokacija===selLok);const kol=cur?.kolicina||0;return<div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 12px",background:"#FEFCF5",borderRadius:8,border:"1px solid #E8DECA",marginBottom:4}}><div style={{flex:1,fontSize:13,fontWeight:600}}>{p.naziv}</div>{tI.delta<0&&<span style={{fontSize:11,color:"#7A6545",width:70,textAlign:"right",flexShrink:0}}>stanje: <b>{kol}</b></span>}<input type="number" min="0" value={stavke[p.id]||""} onChange={e=>setSt(f=>({...f,[p.id]:e.target.value}))} style={{...S.input,width:75,textAlign:"right"}} placeholder="0"/></div>;})}
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:10}}><Btn icon={tI.icon} label={`Potvrdi ${tI.label}`} onClick={save} color={tI.boja} full/><Btn icon="✕" label="Otkaži" onClick={()=>setShow(false)} color="#7A6545" full/></div>
      </Modal>}
    </div>
  );
}

// ── POPIS ─────────────────────────────────────────────────────────
function Popis({data,persist,session,myLokal,addLog}) {
  const [show,setShow]=useState(false); const [selLok,setSelL]=useState(myLokal&&myLokal!=="proizvodnja"?myLokal:"mama1"); const [counted,setCnt]=useState({});
  const lokovi=myLokal&&myLokal!=="proizvodnja"?[myLokal]:["mama1","mama2"];
  const save=()=>{
    const stavke=Object.entries(counted).filter(([,v])=>v!=="").map(([id,kol])=>{const cur=(data.stanjeLokala||[]).find(s=>s.prodId===id&&s.lokacija===selLok);return{prodId:id,sistemska:cur?.kolicina||0,stvarna:+kol,razlika:+kol-(cur?.kolicina||0)};});
    if(!stavke.length){alert("Unesite barem jedan artikal!");return;}
    let ns=[...(data.stanjeLokala||[])];
    stavke.forEach(st=>{ns=ns.map(s=>s.prodId===st.prodId&&s.lokacija===selLok?{...s,kolicina:st.stvarna}:s);});
    const popis={id:data.nextId.popisi,lokacija:selLok,lokNaziv:LOKALI[selLok].naziv,datum:today(),vreme:nowStr(),stavke,korisnik:session.ime};
    persist(addLog({...data,stanjeLokala:ns,popisi:[popis,...(data.popisi||[])],nextId:{...data.nextId,popisi:data.nextId.popisi+1}},`Popis ${LOKALI[selLok].naziv}`));
    setShow(false);
  };
  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>

      </Modal>}
    </div>
  );
}

// ── SIROVINE ──────────────────────────────────────────────────────
function Sirovine({data,persist,perms,session,addLog}) {
  const [showPocetni, setShowPocetni] = useState(false);
  const [pocetneKol, setPocetneKol] = useState({});
  const [showAdd,setAdd]=useState(false); const [showMov,setMov]=useState(false); const [editId,setEId]=useState(null); const [filter,setFil]=useState("");
  const [form,setF]=useState({sifra:"",naziv:"",kat:"",jm:"kg",kolicina:"",cena:"",min:"",max:""});
  const [kForm,setK]=useState({siroId:"",vrsta:"ULAZ",kolicina:"",napomena:""});
  const saveS=()=>{const ns={...form,id:editId||data.nextId.sirovine,kolicina:+form.kolicina,cena:+form.cena,min:+form.min,max:+form.max};persist(addLog({...data,sirovine:editId?(data.sirovine||[]).map(s=>s.id===editId?ns:s):[...(data.sirovine||[]),ns],nextId:{...data.nextId,sirovine:data.nextId.sirovine+1}},editId?`Izmjena: ${form.naziv}`:`Dodana: ${form.naziv}`));setAdd(false);setEId(null);};
  const saveK=()=>{const s=(data.sirovine||[]).find(x=>x.id===+kForm.siroId);if(!s)return;const d=kForm.vrsta==="ULAZ"?+kForm.kolicina:-Math.abs(+kForm.kolicina);if(s.kolicina+d<0){alert("Nedovoljno!");return;}const k={id:data.nextId.kretanja,siroId:s.id,naziv:s.naziv,vrsta:kForm.vrsta,kolicina:+kForm.kolicina,cena:s.cena,vrednost:+kForm.kolicina*s.cena,datum:today(),vreme:nowStr(),korisnik:session.ime,napomena:kForm.napomena};persist(addLog({...data,sirovine:(data.sirovine||[]).map(x=>x.id===s.id?{...x,kolicina:x.kolicina+d}:x),kretanja:[k,...(data.kretanja||[])],nextId:{...data.nextId,kretanja:data.nextId.kretanja+1}},`${kForm.vrsta}: ${s.naziv}`));setMov(false);setK({siroId:"",vrsta:"ULAZ",kolicina:"",napomena:""});};
  const siro=(data.sirovine||[]).filter(s=>s.naziv.toLowerCase().includes(filter.toLowerCase())||s.sifra.toLowerCase().includes(filter.toLowerCase()));
  const grupe={};siro.forEach(s=>{if(!grupe[s.kat])grupe[s.kat]=[];grupe[s.kat].push(s);});
  const savePocetniPopis = () => {
    const unesene = Object.entries(pocetneKol).filter(([,v])=>v!=="");
    if(!unesene.length){ alert("Unesite barem jednu količinu!"); return; }
    const novoStanje = (data.sirovine||[]).map(function(s) {
      const v = pocetneKol[s.id];
      return v!=="" && v!==undefined ? {...s, kolicina:+v} : s;
    });
    const kretanja = [...(data.kretanja||[])];
    let nextKr = data.nextId.kretanja||1;
    unesene.forEach(function([id,kol]) {
      const sir = (data.sirovine||[]).find(function(s){return s.id===+id;});
      if(sir && +kol>0) {
        kretanja.push({id:nextKr++, siroId:+id, naziv:sir.naziv, vrsta:"ULAZ",
          kolicina:+kol, cena:sir.cena||0, datum:today(), napomena:"Početni popis"});
      }
    });
    persist(addLog({...data, sirovine:novoStanje, kretanja, pocetniPopis:true,
      nextId:{...data.nextId, kretanja:nextKr}}, "✅ Početni popis sirovina unesen"));
    setShowPocetni(false);
    setPocetneKol({});
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        <input value={filter} onChange={e=>setFil(e.target.value)} placeholder="🔍 Pretraga..." style={{...S.input,flex:1,minWidth:180,borderRadius:25}}/>
        {perms.canEdit&&<><Btn icon="📥" label="Ulaz / Izlaz" onClick={()=>setMov(true)} color="#107C41"/>{!data.pocetniPopis&&<Btn icon="🧾" label="Početni popis" onClick={()=>{setPocetneKol({});setShowPocetni(true);}} color="#1565C0"/>}{data.pocetniPopis&&<span style={{background:"#E8F5E9",color:"#107C41",fontSize:11,fontWeight:700,padding:"5px 12px",borderRadius:20}}>✅ Početni popis unesen</span>}<Btn icon="➕" label="Nova Sirovina" onClick={()=>{setAdd(true);setEId(null);setF({sifra:"",naziv:"",kat:"",jm:"kg",kolicina:"",cena:"",min:"",max:"",tip:"okvirno"});}} color="#C8860A"/></>}
      </div>
      {Object.entries(grupe).map(([kat,items])=>(
        <Card key={kat} title={kat}><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{background:"#C8860A"}}>{["Šifra","Naziv","Tip","Jm","Kol.","Cena","Vrednost","Min","Status",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>{items.map((s,i)=>{const st=s.min>0&&s.kolicina<=s.min?"NISKO":"OK";return<tr key={s.id} style={{background:i%2===0?"white":"#FAF6EE"}}>
            <td style={S.td}><Tag bg="#E8D5A0" color="#C8860A">{s.sifra}</Tag></td><td style={{...S.td,fontWeight:600}}>{s.naziv}</td>
            <td style={{...S.td,textAlign:"center"}}>
              {(s.tip||"okvirno")==="precizno"&&<Tag bg="#FFEBEE" color="#C00000">🔴 Precizno</Tag>}
              {(s.tip||"okvirno")==="okvirno"&&<Tag bg="#FFFDE7" color="#C8860A">🟡 Okvirno</Tag>}
              {(s.tip||"okvirno")==="nabavka"&&<Tag bg="#F5F5F5" color="#7A6545">⚪ Nabavka</Tag>}
            </td>
            <td style={{...S.td,textAlign:"center"}}>{s.jm}</td>
            <td style={{...S.td,textAlign:"right",fontWeight:700,color:s.min>0&&s.kolicina<=s.min?"#C00000":"#1C1A17"}}>{fmtN(s.kolicina)}</td>
            <td style={{...S.td,textAlign:"right"}}>{fmtN(s.cena)}</td><td style={{...S.td,textAlign:"right",fontWeight:700,color:"#107C41"}}>{fmt(s.kolicina*s.cena)}</td>
            <td style={{...S.td,textAlign:"right"}}>{fmtN(s.min)}</td>
            <td style={S.td}><Tag bg={st==="OK"?"#E8F5E9":"#FFF0F0"} color={st==="OK"?"#107C41":"#C00000"}>{st==="OK"?"✅ OK":"⚠️ NISKO"}</Tag></td>
            <td style={S.td}>{perms.canEdit&&<button onClick={()=>{setEId(s.id);setF({sifra:s.sifra,naziv:s.naziv,kat:s.kat,jm:s.jm,kolicina:s.kolicina,cena:s.cena,min:s.min,max:s.max,tip:s.tip||"okvirno"});setAdd(true);}} style={S.btn2}>✏️</button>}{perms.canDelete&&<button onClick={()=>{if(window.confirm("Obrisati?"))persist(addLog({...data,sirovine:(data.sirovine||[]).filter(x=>x.id!==s.id)},`Obrisao: ${s.naziv}`));}} style={{...S.btn2,background:"#FFF0F0",color:"#C00000"}}>🗑️</button>}</td>
          </tr>;})}
          </tbody></table></div>
        </Card>
      ))}
      {showAdd&&<Modal title={editId?"✏️ Uredi":"➕ Nova Sirovina"} onClose={()=>{setAdd(false);setEId(null);}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>{[["sifra","Šifra","text"],["naziv","Naziv","text"],["kat","Kategorija","text"],["jm","Jed. Mere","text"],["kolicina","Količina","number"],["cena","Cena (RSD/jm)","number"],["min","Min Zaliha","number"],["max","Max Zaliha","number"]].map(([k,l,t])=><div key={k}><label style={S.label}>{l}</label><input value={form[k]} onChange={e=>setF(f=>({...f,[k]:e.target.value}))} style={S.input} type={t}/></div>)}</div>
        
        <div style={{marginTop:14}}>
          <label style={S.label}>Tip praćenja</label>
          <div style={{display:"flex",gap:8,marginTop:4}}>
            {[
              {v:"precizno", l:"🔴 Precizno", opis:"Skup materijal — tačan gram"},
              {v:"okvirno",  l:"🟡 Okvirno",  opis:"Važna sirovina — periodični popis"},
              {v:"nabavka",  l:"⚪ Samo nabavka", opis:"Sitnica — samo trošak"}
            ].map(t=>(
              <button key={t.v} onClick={()=>setF(f=>({...f,tip:t.v}))}
                style={{flex:1,padding:"8px 6px",borderRadius:8,border:"2px solid "+(form.tip===t.v?"#C8860A":"#E8DECA"),
                  background:form.tip===t.v?"#FFF8DC":"white",cursor:"pointer",textAlign:"center"}}>
                <div style={{fontSize:12,fontWeight:700}}>{t.l}</div>
                <div style={{fontSize:10,color:"#7A6545",marginTop:2}}>{t.opis}</div>
              </button>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:18}}><Btn icon="💾" label="Sačuvaj" onClick={saveS} color="#C8860A" full/><Btn icon="✕" label="Otkaži" onClick={()=>{setAdd(false);setEId(null);}} color="#7A6545" full/></div>
      </Modal>}
      {showMov&&<Modal title="📥 Ulaz / Izlaz Sirovine" onClose={()=>setMov(false)}>
        <div style={{display:"flex",gap:10,marginBottom:14}}>{["ULAZ","IZLAZ"].map(v=><button key={v} onClick={()=>setK(f=>({...f,vrsta:v}))} style={{flex:1,padding:"12px",borderRadius:10,border:`2px solid ${kForm.vrsta===v?(v==="ULAZ"?"#107C41":"#C00000"):"#E0D5BE"}`,background:kForm.vrsta===v?(v==="ULAZ"?"#E8F5E9":"#FFF0F0"):"white",color:v==="ULAZ"?"#107C41":"#C00000",fontWeight:700,cursor:"pointer",fontSize:15}}>{v==="ULAZ"?"📦 ULAZ":"📤 IZLAZ"}</button>)}</div>
        <label style={S.label}>Sirovina</label><select value={kForm.siroId} onChange={e=>setK(f=>({...f,siroId:e.target.value}))} style={{...S.input,marginBottom:12}}><option value="">-- Odaberite --</option>{(data.sirovine||[]).map(s=><option key={s.id} value={s.id}>{s.naziv} ({fmtN(s.kolicina)} {s.jm})</option>)}</select>
        <label style={S.label}>Količina</label><input type="number" value={kForm.kolicina} onChange={e=>setK(f=>({...f,kolicina:e.target.value}))} style={{...S.input,marginBottom:12}}/>
        <label style={S.label}>Napomena</label><input value={kForm.napomena} onChange={e=>setK(f=>({...f,napomena:e.target.value}))} style={{...S.input,marginBottom:14}} placeholder="npr. od dobavljača..."/>
        <div style={{display:"flex",gap:10}}><Btn icon={kForm.vrsta==="ULAZ"?"📦":"📤"} label={`Potvrdi ${kForm.vrsta}`} onClick={saveK} color={kForm.vrsta==="ULAZ"?"#107C41":"#C00000"} full/><Btn icon="✕" label="Otkaži" onClick={()=>setMov(false)} color="#7A6545" full/></div>
      </Modal>}
    </div>
  );
}

// ── TROŠKOVI ──────────────────────────────────────────────────────
function Troskovi({data,persist,perms}) {
  const [show,setShow]=useState(false); const [form,setF]=useState({mesec:"",sirovine:"",plate:"",energija:"",najam:"",ostalo:"",prihod_m1:"",prihod_m2:""});
  const save=()=>{const row={mesec:form.mesec,sirovine:+form.sirovine,plate:+form.plate,energija:+form.energija,najam:+form.najam,ostalo:+form.ostalo,prihod_m1:+form.prihod_m1,prihod_m2:+form.prihod_m2};const ex=(data.troskoviMesecni||[]).find(m=>m.mesec===form.mesec);persist({...data,troskoviMesecni:ex?(data.troskoviMesecni||[]).map(m=>m.mesec===form.mesec?row:m):[...(data.troskoviMesecni||[]),row]});setShow(false);};
  const chart=(data.troskoviMesecni||[]).map(m=>({...m,ukupno:m.sirovine+m.plate+m.energija+m.najam+m.ostalo,prihod:m.prihod_m1+m.prihod_m2,profit:(m.prihod_m1+m.prihod_m2)-(m.sirovine+m.plate+m.energija+m.najam+m.ostalo)}));
  const god=chart.reduce((a,m)=>({p:a.p+m.prihod,t:a.t+m.ukupno,pr:a.pr+m.profit}),{p:0,t:0,pr:0});
  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:12}}>
        {[{l:"Godišnji Prihod",v:fmt(god.p),c:"#107C41",b:"#E8F5E9"},{l:"Godišnji Troškovi",v:fmt(god.t),c:"#C00000",b:"#FFF0F0"},{l:"Godišnji Profit",v:fmt(god.pr),c:god.pr>=0?"#107C41":"#C00000",b:god.pr>=0?"#E8F5E9":"#FFF0F0"},{l:"Prosj. Marža",v:god.p>0?(god.pr/god.p*100).toFixed(1)+"%":"–",c:"#C8860A",b:"#FFF8DC"}].map((k,i)=><div key={i} style={{background:k.b,borderRadius:12,padding:"14px 16px"}}><div style={{fontSize:16,fontWeight:800,color:k.c}}>{k.v}</div><div style={{fontSize:11,color:"#5A4A35",marginTop:4,fontWeight:600}}>{k.l}</div></div>)}
      </div>
      {perms.canEdit&&<div><Btn icon="➕" label="Unesi Mesečne Podatke" onClick={()=>setShow(true)} color="#C8860A"/></div>}
      {chart.length>0&&<Card title="📊 Prihod vs Troškovi vs Profit"><ResponsiveContainer width="100%" height={220}><BarChart data={chart}><CartesianGrid strokeDasharray="3 3" stroke="#E8DECA"/><XAxis dataKey="mesec" tick={{fontSize:10}}/><YAxis tick={{fontSize:9}} tickFormatter={v=>(v/1000).toFixed(0)+"k"}/><Tooltip formatter={v=>fmtN(v)+" RSD"}/><Legend iconSize={10} wrapperStyle={{fontSize:11}}/><Bar dataKey="prihod" fill="#107C41" name="Prihod" radius={[3,3,0,0]}/><Bar dataKey="ukupno" fill="#C0392B" name="Troškovi" radius={[3,3,0,0]}/><Bar dataKey="profit" fill="#E8A020" name="Profit" radius={[3,3,0,0]}/></BarChart></ResponsiveContainer></Card>}
      {show&&<Modal title="➕ Mesečni Podaci" onClose={()=>setShow(false)}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>{[["mesec","Mesec (npr. Feb 2025)","text"],["sirovine","Troškovi Sirovine","number"],["plate","Plate","number"],["energija","Energija","number"],["najam","Najam","number"],["ostalo","Ostali Troškovi","number"],["prihod_m1","Prihod Mama 1","number"],["prihod_m2","Prihod Mama 2","number"]].map(([k,l,t])=><div key={k}><label style={S.label}>{l}</label><input value={form[k]} onChange={e=>setF(f=>({...f,[k]:e.target.value}))} style={S.input} type={t}/></div>)}</div>
        <div style={{display:"flex",gap:10,marginTop:18}}><Btn icon="💾" label="Sačuvaj" onClick={save} color="#C8860A" full/><Btn icon="✕" label="Otkaži" onClick={()=>setShow(false)} color="#7A6545" full/></div>
      </Modal>}
    </div>
  );
}

// ── DOBAVLJAČI ────────────────────────────────────────────────────

      <Card title="🚛 Registar Dobavljača">
        {(data.dobavljaci||[]).length===0?<p style={{color:"#7A6545",fontSize:13,textAlign:"center",padding:20}}>Nema dobavljača.</p>:<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{background:"#C8860A"}}>{["Naziv","Kontakt","Telefon","Kategorija","Ocjena","Status",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>{(data.dobavljaci||[]).map((d,i)=><tr key={d.id} style={{background:i%2===0?"white":"#FAF6EE"}}><td style={{...S.td,fontWeight:700}}>{d.naziv}</td><td style={S.td}>{d.kontakt}</td><td style={S.td}>{d.telefon}</td><td style={S.td}><Tag bg="#E8D5A0" color="#C8860A">{d.kat}</Tag></td><td style={{...S.td,textAlign:"center"}}>{"⭐".repeat(d.ocena)}</td><td style={S.td}><Tag bg={d.status==="AKTIVAN"?"#E8F5E9":"#FFF0F0"} color={d.status==="AKTIVAN"?"#107C41":"#C00000"}>{d.status}</Tag></td><td style={S.td}>{perms.canEdit&&<button onClick={()=>{setEId(d.id);setF({naziv:d.naziv,kontakt:d.kontakt,telefon:d.telefon,kat:d.kat,ocena:d.ocena,status:d.status});setAdd(true);}} style={S.btn2}>✏️</button>}{perms.canDelete&&<button onClick={()=>{if(window.confirm("Obrisati?"))persist(addLog({...data,dobavljaci:(data.dobavljaci||[]).filter(x=>x.id!==d.id)},`Obrisao: ${d.naziv}`));}} style={{...S.btn2,background:"#FFF0F0",color:"#C00000"}}>🗑️</button>}</td></tr>)}
          </tbody></table></div>}
      </Card>
      {showAdd&&<Modal title={editId?"✏️ Uredi":"➕ Novi Dobavljač"} onClose={()=>{setAdd(false);setEId(null);}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>{[["naziv","Naziv Firme"],["kontakt","Kontakt Osoba"],["telefon","Telefon"],["kat","Kat. Materijala"]].map(([k,l])=><div key={k}><label style={S.label}>{l}</label><input value={form[k]} onChange={e=>setF(f=>({...f,[k]:e.target.value}))} style={S.input}/></div>)}<div><label style={S.label}>Ocjena</label><select value={form.ocena} onChange={e=>setF(f=>({...f,ocena:+e.target.value}))} style={S.input}>{[1,2,3,4,5].map(n=><option key={n} value={n}>{"⭐".repeat(n)}</option>)}</select></div><div><label style={S.label}>Status</label><select value={form.status} onChange={e=>setF(f=>({...f,status:e.target.value}))} style={S.input}><option>AKTIVAN</option><option>NEAKTIVAN</option></select></div></div>
        <div style={{display:"flex",gap:10,marginTop:18}}><Btn icon="💾" label="Sačuvaj" onClick={saveD} color="#C8860A" full/><Btn icon="✕" label="Otkaži" onClick={()=>{setAdd(false);setEId(null);}} color="#7A6545" full/></div>
      </Modal>}
    </div>
  );
}

// ── AKTIVNOST ─────────────────────────────────────────────────────
function Aktivnost({data,session}) {
  const log=(data.activityLog||[]).filter(a=>["direktor","magacioner"].includes(session.uloga)?true:a.user===session.ime);
  return(<Card title="🕐 Evidencija Aktivnosti">{log.length===0?<p style={{textAlign:"center",padding:30,color:"#7A6545"}}>Nema aktivnosti.</p>:log.map((a,i)=><div key={i} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"10px 14px",background:i%2===0?"white":"#FAF6EE",borderRadius:10,border:"1px solid #E8DECA",marginBottom:6}}><span style={{fontSize:18}}>{ULOGE[a.uloga]?.icon||"👤"}</span><div style={{flex:1}}><span style={{fontWeight:700,color:"#C8860A"}}>{a.user}</span><span style={{fontSize:11,color:"#7A6545",marginLeft:6}}>({ULOGE[a.uloga]?.label||a.uloga})</span><div style={{color:"#5A4A35",fontSize:13,marginTop:2}}>{a.action}</div></div><div style={{color:"#C8A050",fontSize:10,whiteSpace:"nowrap"}}>{a.vreme}</div></div>)}</Card>);
}


// ── ZAKLJUČAK SMJENE ────────────────────────────────────────────
function ZaklucakSmjene({data,persist,session,myLokal,addLog}) {
  const [show,setShow]=useState(false);
  const [selLok,setSelL]=useState(myLokal&&myLokal!=="proizvodnja"?myLokal:"mama1");
  const [krajnje,setKraj]=useState({});
  const [blagajna,setBlag]=useState("");
  const [printData,setPrint]=useState(null);
  const lokovi=myLokal&&myLokal!=="proizvodnja"?[myLokal]:["mama1","mama2"];

  const startZakljucak=(lok)=>{
    setSelL(lok);
    const kd={};
    getSviP(data).forEach(p=>{kd[p.id]="";});
    setKraj(kd);
    setBlag("");
    setShow(true);
  };

  const save=()=>{
    if(!blagajna&&blagajna!=="0"){alert("Unesite iznos blagajne!");return;}
    const lok=LOKALI[selLok];
    // Računa dostavljeno danas u ovaj lokal
    const danasD=(data.dostave||[]).filter(d=>d.datum===today()&&d.lokacija===selLok);
    const dostavljenoMap={};
    danasD.forEach(d=>d.stavke.forEach(s=>{dostavljenoMap[s.prodId]=(dostavljenoMap[s.prodId]||0)+s.kolicina;}));
    // Posljednji zaključak ili početno stanje
    const prethodni=(data.zaklucakSmjene||[]).find(z=>z.lokacija===selLok&&z.datum===today()&&z.smjena==="jutarnja");
    // Stavke
    const stavke=getSviP(data).map(p=>{
      const pocetno=prethodni?(prethodni.krajnjeStanje.find(s=>s.prodId===p.id)?.kolicina||0):0;
      const dostavljeno=dostavljenoMap[p.id]||0;
      const raspolozivo=pocetno+dostavljeno;
      const krajnjeVal=krajnje[p.id]!==""?+krajnje[p.id]:null;
      const prodano=krajnjeVal!==null?Math.max(0,raspolozivo-krajnjeVal):null;
      const cp=data.cijene?.[p.id]; const cena=getAktivnaCena(cp, 1);
      return{prodId:p.id,naziv:p.naziv,kat:p.kat,pocetno,dostavljeno,raspolozivo,krajnje:krajnjeVal,prodano,cena,promet:prodano?prodano*cena:0};
    }).filter(s=>s.raspolozivo>0||s.krajnje!==null);
    const ukPromet=stavke.reduce((s,x)=>s+x.promet,0);
    const blagajnaNum=+blagajna;
    const razlika=blagajnaNum-ukPromet;
    const smjena=(data.zaklucakSmjene||[]).some(z=>z.lokacija===selLok&&z.datum===today()&&z.smjena==="jutarnja")?"poslijepodnevna":"jutarnja";
    const zak={
      id:data.nextId.zaklucak,lokacija:selLok,lokNaziv:lok.naziv,datum:today(),vreme:nowStr(),
      smjena,stavke,blagajna:blagajnaNum,ocekivaniPromet:ukPromet,razlika,
      krajnjeStanje:stavke.map(s=>({prodId:s.prodId,kolicina:s.krajnje!==null?s.krajnje:s.raspolozivo})),
      korisnik:session.ime
    };
    // Ažurira stanje lokala sa krajnjim stanjem
    let ns=[...(data.stanjeLokala||[])];
    stavke.forEach(s=>{if(s.krajnje!==null){ns=ns.map(x=>x.prodId===s.prodId&&x.lokacija===selLok?{...x,kolicina:s.krajnje}:x);}});
    persist(addLog({...data,stanjeLokala:ns,zaklucakSmjene:[zak,...(data.zaklucakSmjene||[])],nextId:{...data.nextId,zaklucak:data.nextId.zaklucak+1}},`Zaključak ${smjena} smjene — ${lok.naziv}`));
    setShow(false);
    setPrint(zak);
  };

  const printZakljucak=(zak)=>{
    const lok=LOKALI[zak.lokacija];
    const win=window.open("","_blank","width=800,height=900");
    const prodanoUk=zak.stavke.reduce((s,x)=>s+(x.prodano||0),0);
    const rows=zak.stavke.filter(s=>s.raspolozivo>0||s.prodano).map(s=>`
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:6px 8px;">${s.naziv}</td>
        <td style="padding:6px 8px;text-align:center;">${s.pocetno}</td>
        <td style="padding:6px 8px;text-align:center;color:#1565C0;">${s.dostavljeno}</td>
        <td style="padding:6px 8px;text-align:center;font-weight:700;">${s.raspolozivo}</td>
        <td style="padding:6px 8px;text-align:center;">${s.krajnje!==null?s.krajnje:"—"}</td>
        <td style="padding:6px 8px;text-align:center;font-weight:800;color:${(s.prodano||0)>0?"#107C41":"#999"};">${s.prodano!==null?s.prodano:"—"}</td>
        <td style="padding:6px 8px;text-align:right;">${s.cena>0?s.promet.toLocaleString()+" RSD":"—"}</td>
      </tr>`).join("");
    const razlikaColor=Math.abs(zak.razlika)<50?"#107C41":zak.razlika>0?"#1565C0":"#C00000";
    const razlikaText=zak.razlika>0?`Višak: +${zak.razlika.toLocaleString()} RSD`:zak.razlika<0?`Manjak: ${zak.razlika.toLocaleString()} RSD`:"Tačno ✓";
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Mama Mantia — Zaključak Smjene</title>
    <style>body{font-family:'Segoe UI',sans-serif;margin:0;padding:24px;color:#1C1A17}
    h1{font-family:Georgia,serif;font-size:22px;margin:0 0 4px}
    .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #E8A020;padding-bottom:14px;margin-bottom:18px}
    .logo{font-family:Georgia,serif;font-size:28px;font-weight:700;font-style:italic;color:#1C1A17}
    .logo span{color:#C8860A}
    table{width:100%;border-collapse:collapse;font-size:13px}
    thead tr{background:#1C1A17;color:white}
    th{padding:8px;text-align:left;font-weight:600;font-size:11px}
    .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
    .kpi-box{background:#f9f7f2;border:1px solid #e8d5a0;border-radius:10px;padding:12px;text-align:center}
    .kpi-val{font-size:20px;font-weight:800;font-family:Georgia,serif}
    .kpi-lbl{font-size:10px;color:#7A6545;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
    .footer{margin-top:20px;font-size:11px;color:#999;text-align:center;border-top:1px solid #eee;padding-top:12px}
    @media print{body{padding:10px}.no-print{display:none}}
    </style></head><body>
    <div class="header">
      <div><div class="logo">Mama <span>🥟</span> Mantia</div>
      <div style="font-size:12px;color:#7A6545;margin-top:4px">Novi Pazar</div></div>
      <div style="text-align:right">
        <div style="font-size:18px;font-weight:700">${lok.icon} ${zak.lokNaziv}</div>
        <div style="font-size:13px;color:#7A6545;">${zak.datum} · ${zak.smjena==="jutarnja"?"☀️ Jutarnja":"🌙 Poslijepodnevna"} smjena</div>
        <div style="font-size:12px;color:#999">Zaključio: ${zak.korisnik} · ${zak.vreme}</div>
      </div>
    </div>
    <div class="kpi">
      <div class="kpi-box"><div class="kpi-val" style="color:#1C1A17">${prodanoUk}</div><div class="kpi-lbl">Ukupno prodano (kom)</div></div>
      <div class="kpi-box"><div class="kpi-val" style="color:#C8860A">${zak.ocekivaniPromet.toLocaleString()} RSD</div><div class="kpi-lbl">Očekivani promet</div></div>
      <div class="kpi-box"><div class="kpi-val" style="color:#1565C0">${zak.blagajna.toLocaleString()} RSD</div><div class="kpi-lbl">Blagajna (uplaćeno)</div></div>
      <div class="kpi-box"><div class="kpi-val" style="color:${razlikaColor}">${razlikaText}</div><div class="kpi-lbl">Kontrola blagajne</div></div>
    </div>
    <table><thead><tr>
      <th>Artikal</th><th style="text-align:center">Početno</th><th style="text-align:center">Dostavljeno</th>
      <th style="text-align:center">Raspoloživo</th><th style="text-align:center">Krajnje</th>
      <th style="text-align:center">Prodano</th><th style="text-align:right">Promet</th>
    </tr></thead><tbody>${rows}</tbody>
    <tfoot><tr style="background:#f9f7f2;font-weight:700;border-top:2px solid #1C1A17">
      <td style="padding:8px">UKUPNO</td><td></td><td></td><td></td><td></td>
      <td style="padding:8px;text-align:center;font-size:16px;color:#107C41">${prodanoUk}</td>
      <td style="padding:8px;text-align:right;font-size:14px;color:#C8860A">${zak.ocekivaniPromet.toLocaleString()} RSD</td>
    </tr></tfoot></table>
    <div style="background:${Math.abs(zak.razlika)<50?"#E8F5E9":zak.razlika>0?"#EFF6FF":"#FFF0F0"};border-radius:10px;padding:14px 18px;margin-top:16px;display:flex;justify-content:space-between;align-items:center">
      <div><b>Kontrola blagajne</b></div>
      <div style="display:flex;gap:24px;font-size:13px">
        <span>Blagajna: <b>${zak.blagajna.toLocaleString()} RSD</b></span>
        <span>Sistem: <b>${zak.ocekivaniPromet.toLocaleString()} RSD</b></span>
        <span style="font-weight:800;font-size:15px;color:${razlikaColor}">${razlikaText}</span>
      </div>
    </div>
    <div class="footer">Mama Mantia · Sistem Upravljanja · ${zak.datum}</div>
    <div class="no-print" style="margin-top:20px;text-align:center">
      <button onclick="window.print()" style="background:#1C1A17;color:white;border:none;padding:12px 32px;border-radius:10px;font-size:15px;cursor:pointer;font-family:Georgia,serif">🖨️ Štampaj / Sačuvaj PDF</button>
      <button onclick="window.close()" style="background:#eee;color:#333;border:none;padding:12px 24px;border-radius:10px;font-size:15px;cursor:pointer;margin-left:10px">Zatvori</button>
    </div>
    </body></html>`);
    win.document.close();
  };

  const sveSmjene=(data.zaklucakSmjene||[]);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{background:"#FFF8DC",border:"1px solid #E8D5A0",borderRadius:12,padding:"14px 18px",fontSize:13,color:"#5A4A35",lineHeight:1.7}}>
        <b>🏁 Zaključak smjene</b> automatski računa:<br/>
        <b>Prodano</b> = Početno stanje + Dostavljeno danas − Krajnje stanje<br/>
        <b>Kontrola blagajne</b> = Uplaćena blagajna vs Promet po sistemu
      </div>

      {/* Cijene po artiklu — samo za direktora */}
      {session.uloga==="direktor"&&<CijeneModal data={data} persist={persist} />}

      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        {lokovi.map(l=><Btn key={l} icon="🏁" label={`Zaključak — ${LOKALI[l].naziv}`} onClick={()=>startZakljucak(l)} color="#1C1A17"/>)}
      </div>

      {/* Historija zaključaka */}
      <Card title="📋 Historija Zaključaka">
        {sveSmjene.length===0?<p style={{color:"#7A6545",fontSize:13,textAlign:"center",padding:20}}>Nema zaključaka.</p>:
        sveSmjene.slice(0,20).map((z,i)=>{
          const lok=LOKALI[z.lokacija];
          const prodUk=z.stavke.reduce((s,x)=>s+(x.prodano||0),0);
          const razBoja=Math.abs(z.razlika)<50?"#107C41":z.razlika>0?"#1565C0":"#C00000";
          return(
          <div key={z.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:i%2===0?"white":"#FAF6EE",borderRadius:10,border:"1px solid #E8DECA",marginBottom:6}}>
            <div style={{fontSize:22}}>{z.smjena==="jutarnja"?"☀️":"🌙"}</div>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:4}}>
                <Tag bg={lok.bg} color={lok.boja}>{lok.icon} {lok.naziv}</Tag>
                <Tag bg="#FAF6EE" color="#1C1A17">{z.datum}</Tag>
                <Tag bg="#FFF8DC" color="#C8860A">{z.smjena==="jutarnja"?"Jutarnja":"Poslijepodnevna"}</Tag>
              </div>
              <div style={{display:"flex",gap:16,fontSize:12,flexWrap:"wrap"}}>
                <span>📦 Prodano: <b style={{color:"#107C41"}}>{prodUk} kom</b></span>
                <span>💰 Blagajna: <b>{z.blagajna?.toLocaleString()} RSD</b></span>
                <span>📊 Sistem: <b>{z.ocekivaniPromet?.toLocaleString()} RSD</b></span>
                <span style={{fontWeight:700,color:razBoja}}>{Math.abs(z.razlika)<50?"✅ Tačno":z.razlika>0?`💙 Višak: +${z.razlika} RSD`:`⚠️ Manjak: ${z.razlika} RSD`}</span>
              </div>
            </div>
            <button onClick={()=>printZakljucak(z)} style={{...S.btn2,background:"#1C1A17",color:"white",padding:"8px 14px",fontSize:12,borderRadius:8,border:"none"}}>🖨️ PDF</button>
          </div>);
        })}
      </Card>

      {show&&<Modal title={`🏁 Zaključak Smjene — ${LOKALI[selLok].naziv}`} onClose={()=>setShow(false)}>
        <div style={{background:"#FFF8DC",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#5A4A35",fontWeight:600,marginBottom:14}}>
          📅 {today()} · {(data.zaklucakSmjene||[]).some(z=>z.lokacija===selLok&&z.datum===today()&&z.smjena==="jutarnja")?"🌙 Poslijepodnevna smjena":"☀️ Jutarnja smjena"} · {session.ime}
        </div>
        <div style={{marginBottom:14}}>
          <label style={S.label}>💵 Blagajna — uplaćeno u kasi (RSD)</label>
          <input type="number" value={blagajna} onChange={e=>setBlag(e.target.value)} style={{...S.input,fontSize:20,textAlign:"right",fontWeight:700}} placeholder="0"/>
        </div>
        <label style={{...S.label,marginBottom:8}}>📦 Unesite KRAJNJE stanje po artiklu (šta ostaje)</label>
        <div style={{maxHeight:380,overflowY:"auto",display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
          {getKat(data).map(kat=>{
            const katItems=kat.proizvodi.filter(p=>{
              const stanje=(data.stanjeLokala||[]).find(s=>s.prodId===p.id&&s.lokacija===selLok);
              const danasD=(data.dostave||[]).filter(d=>d.datum===today()&&d.lokacija===selLok);
              const dostMap={};danasD.forEach(d=>d.stavke.forEach(s=>{dostMap[s.prodId]=(dostMap[s.prodId]||0)+s.kolicina;}));
              return (stanje?.kolicina||0)+(dostMap[p.id]||0)>0;
            });
            if(!katItems.length)return null;
            return(<div key={kat.id}><div style={{fontWeight:700,fontSize:12,color:kat.boja,marginBottom:5,paddingTop:6,borderTop:"1px solid #F0E6D8"}}>{kat.icon} {kat.naziv}</div>
              {katItems.map(p=>{
                const stanje=(data.stanjeLokala||[]).find(s=>s.prodId===p.id&&s.lokacija===selLok);
                const danasD=(data.dostave||[]).filter(d=>d.datum===today()&&d.lokacija===selLok);
                const dostMap={};danasD.forEach(d=>d.stavke.forEach(s=>{dostMap[s.prodId]=(dostMap[s.prodId]||0)+s.kolicina;}));
                const raspolozivo=(stanje?.kolicina||0)+(dostMap[p.id]||0);
                const kv=krajnje[p.id];
                const prodano=kv!==""&&kv!==undefined?Math.max(0,raspolozivo-+kv):null;
                return(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"#FFFDF5",borderRadius:8,border:"1px solid #E8DECA",marginBottom:4}}>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{p.naziv}</div><div style={{fontSize:11,color:"#7A6545"}}>Raspoloživo: <b>{raspolozivo}</b></div></div>
                  <input type="number" min="0" max={raspolozivo} value={krajnje[p.id]||""} onChange={e=>setKraj(k=>({...k,[p.id]:e.target.value}))} style={{...S.input,width:80,textAlign:"right"}} placeholder="0"/>
                  {prodano!==null&&<div style={{width:70,textAlign:"right"}}><div style={{fontSize:10,color:"#7A6545"}}>Prodano</div><div style={{fontWeight:800,fontSize:16,color:prodano>0?"#107C41":"#999"}}>{prodano}</div></div>}
                </div>);
              })}
            </div>);
          })}
        </div>
        <div style={{background:"#E8F5E9",borderRadius:10,padding:"10px 14px",fontSize:13,marginBottom:14,display:"flex",justifyContent:"space-between"}}>
          <span>📦 Ukupno prodano: <b>{Object.entries(krajnje).reduce((s,[id,v])=>{if(v==="")return s;const st=(data.stanjeLokala||[]).find(x=>x.prodId===id&&x.lokacija===selLok);const dd=(data.dostave||[]).filter(d=>d.datum===today()&&d.lokacija===selLok);const dm={};dd.forEach(d=>d.stavke.forEach(ss=>{dm[ss.prodId]=(dm[ss.prodId]||0)+ss.kolicina;}));const r=(st?.kolicina||0)+(dm[id]||0);return s+Math.max(0,r-+v);},0)} kom</b></span>
          {blagajna&&<span>💵 Blagajna: <b>{Number(blagajna).toLocaleString()} RSD</b></span>}
        </div>
        <div style={{display:"flex",gap:10}}><Btn icon="🏁" label="Zaključi Smjenu" onClick={save} color="#1C1A17" full/><Btn icon="✕" label="Otkaži" onClick={()=>setShow(false)} color="#7A6545" full/></div>
      </Modal>}

    </div>

// { maloprodaja: 35, veleprodaja: 30, pragVeleprodaje: 100,
//   tepsija: { naziv:"Tepsija (60 kom)", kolicina:60, cena:1500 },
//   akcija: { naziv:"Ljetna akcija", popust:10, od:"2025-06-01", do:"2025-08-31" } }

function getAktivnaCena(ceneObj, kolicina=1) {
  if(!ceneObj) return 0;
  // Provjeri akcijsku cijenu (datum)
  if(ceneObj.akcija?.popust && ceneObj.akcija.od && ceneObj.akcija.do) {
    const dan = today();
    if(dan >= ceneObj.akcija.od && dan <= ceneObj.akcija.do) {
      const osnova = ceneObj.maloprodaja||0;
      return Math.round(osnova * (1 - ceneObj.akcija.popust/100));
    }
  }
  // Provjeri veleprodajni prag
  if(ceneObj.veleprodaja && ceneObj.pragVeleprodaje && kolicina >= ceneObj.pragVeleprodaje) {
    return ceneObj.veleprodaja;
  }
  return ceneObj.maloprodaja||0;
}

function Otpremnice({data,persist,perms,session,addLog}) {
  const [show,setShow]=useState(false);
  const [form,setF]=useState({dobId:"",brOtpremnice:"",napomena:"",datum:today()});
  const [stavke,setSt]=useState([{siroId:"",kolicina:"",cena:""}]);
  const [otrSearch,setOtrSearch]=useState("");

  const addStavka=()=>setSt(s=>[...s,{siroId:"",kolicina:"",cena:""}]);
  const removeStavka=i=>setSt(s=>s.filter((_,idx)=>idx!==i));
  const updStavka=(i,field,val)=>setSt(s=>s.map((x,idx)=>idx===i?{...x,[field]:val}:x));

  const save=()=>{
    const validStavke=stavke.filter(s=>s.siroId&&+s.kolicina>0);
    if(!validStavke.length){alert("Dodajte barem jednu stavku!");return;}
    const dob=(data.dobavljaci||[]).find(d=>d.id===+form.dobId);
    if(!dob&&form.dobId){alert("Odaberite dobavljača!");return;}
    // Ažurira stanje sirovina
    let noveSirovine=[...(data.sirovine||[])];
    validStavke.forEach(s=>{
      noveSirovine=noveSirovine.map(sir=>sir.id===+s.siroId?{...sir,kolicina:sir.kolicina+(+s.kolicina),cena:+s.cena>0?+s.cena:sir.cena}:sir);
    });
    // Kretanja
    const novaKretanja=validStavke.map((s,idx)=>{
      const sir=noveSirovine.find(x=>x.id===+s.siroId);
      return{id:data.nextId.kretanja+idx,siroId:+s.siroId,naziv:sir?.naziv||"?",vrsta:"ULAZ",kolicina:+s.kolicina,cena:+s.cena||sir?.cena||0,vrednost:(+s.kolicina)*(+s.cena||sir?.cena||0),datum:form.datum,vreme:nowStr(),korisnik:session.ime,napomena:`Otpremnica ${form.brOtpremnice}`};
    });
    const ukupno=validStavke.reduce((s,st)=>s+(+st.kolicina)*(+st.cena||0),0);
    const otp={
      id:data.nextId.otpremnica,
      brOtpremnice:form.brOtpremnice,
      dobavljacId:+form.dobId||null,
      dobavljacNaziv:dob?.naziv||"Bez dobavljača",
      datum:form.datum,vreme:nowStr(),
      stavke:validStavke.map(s=>{const sir=(data.sirovine||[]).find(x=>x.id===+s.siroId);return{siroId:+s.siroId,naziv:sir?.naziv||"?",jm:sir?.jm||"",kolicina:+s.kolicina,cena:+s.cena||0,vrednost:(+s.kolicina)*(+s.cena||0)};}),
      ukupno,napomena:form.napomena,korisnik:session.ime
    };
    persist(addLog({...data,sirovine:noveSirovine,otpremnice:[otp,...(data.otpremnice||[])],kretanja:[...novaKretanja,...(data.kretanja||[])],nextId:{...data.nextId,otpremnica:data.nextId.otpremnica+1,kretanja:data.nextId.kretanja+validStavke.length}},`Otpremnica ${form.brOtpremnice||"#"+data.nextId.otpremnica} — ${dob?.naziv||"?"}`));
    setShow(false);setSt([{siroId:"",kolicina:"",cena:""}]);setF({dobId:"",brOtpremnice:"",napomena:"",datum:today()});
  };

  const printOtp=(o)=>{
    const win=window.open("","_blank","width=700,height=800");

    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Otpremnica ${o.brOtpremnice}</title>

    th{padding:8px 10px;text-align:left;font-size:11px}
    @media print{.no-print{display:none}}</style></head><body>

      {perms.canEdit&&<div><Btn icon="📄" label="Nova Otpremnica (Prijem Robe)" onClick={()=>setShow(true)} color="#1C1A17"/></div>}
      <Card title="📋 Arhiva Otpremnica">
        <input placeholder="🔍 Pretraži otpremnice..." value={otrSearch} onChange={e=>setOtrSearch(e.target.value)} style={{...S.input,marginBottom:10}}/>
        {(data.otpremnice||[]).length===0?<p style={{color:"#7A6545",fontSize:13,textAlign:"center",padding:20}}>Nema otpremnica. Unesite prvu otpremnicu klikom iznad.</p>:
        (data.otpremnice||[]).filter(o=>!otrSearch||(o.brOtpremnice||"").toString().includes(otrSearch)||(o.dobavljacNaziv||"").toLowerCase().includes(otrSearch.toLowerCase())||(o.datum||"").includes(otrSearch)).slice(0,30).map((o,i)=>(

              </div>
              <div style={{fontSize:12,color:"#5A4A35"}}>
                {o.stavke.length} stavki · {o.stavke.slice(0,3).map(s=>`${s.naziv} (${s.kolicina} ${s.jm})`).join(", ")}{o.stavke.length>3?"...":""}
                {o.ukupno>0&&<span style={{marginLeft:8,fontWeight:700,color:"#C8860A"}}> · {o.ukupno.toLocaleString()} RSD</span>}

          </div>
