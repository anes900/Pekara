                </tbody>
              </table></div>
            </Card>
          )}
        </div>
      )}

      {tab==="profit"&&(
        <ProfitTab data={data} filterByPeriod={filterByPeriod} period={period}/>
      )}
    </div>
  );
}


// ── UPRAVLJANJE PROIZVODIMA ───────────────────────────────────────
// ── NORMATIVI ──────────────────────────────────────────────────────
function Normativi({data, persist, session, addLog}) {
  const [selProd, setSelProd] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [stavke, setStavke] = useState([]);
  const [filter, setFilter] = useState("");
  const sviP = getSviP(data);
  const perms = ULOGE[session.uloga]||{};

  const otvoriEditor = (prod) => {
    const ex = (data.normativi||[]).find(n=>n.prodId===prod.id);
    setSelProd(prod);
    setStavke(ex ? ex.stavke.map(s=>({...s})) : []);
    setShowForm(true);
  };

  const dodajStavku = () => setStavke(prev=>[...prev,{siroId:"",naziv:"",kolicina:"",jm:""}]);

  const izmijeniStavku = (i, field, val) => setStavke(prev=>prev.map((s,idx)=>{
    if(idx!==i) return s;
    if(field==="siroId"){
      const sir=(data.sirovine||[]).find(x=>x.id===+val);
      return {...s, siroId:+val, naziv:sir?sir.naziv:"", jm:sir?sir.jm:""};
    }
    return {...s, [field]:val};
  }));

  const ukloniStavku = (i) => setStavke(prev=>prev.filter((_,idx)=>idx!==i));

  const sacuvaj = () => {
    if(!selProd) return;
    const validne = stavke.filter(s=>s.siroId&&+s.kolicina>0);
    if(!validne.length){ alert("Dodajte bar jednu sirovinu!"); return; }
    const noviN = {prodId:selProd.id, stavke:validne.map(s=>({siroId:s.siroId,naziv:s.naziv,kolicina:+s.kolicina,jm:s.jm}))};
    const ostali = (data.normativi||[]).filter(n=>n.prodId!==selProd.id);
    persist(addLog({...data,normativi:[noviN,...ostali]}, "Normativ: "+selProd.naziv));
    setShowForm(false);
  };

  const obrisi = (prodId) => {
    if(!window.confirm("Obrisati normativ?")) return;
    const prod = sviP.find(p=>p.id===prodId);
    persist(addLog({...data,normativi:(data.normativi||[]).filter(n=>n.prodId!==prodId)},
      "Obrisan normativ: "+(prod?prod.naziv:prodId)));
  };

  const trosakEditora = stavke.filter(s=>s.siroId&&+s.kolicina>0).reduce((s,st)=>{
    const sir=(data.sirovine||[]).find(x=>x.id===+st.siroId);
    return s + +st.kolicina*(sir?sir.cena||0:0);
  },0);

  const filtrirani = sviP.filter(p=>!filter||p.naziv.toLowerCase().includes(filter.toLowerCase()));
  const poKat = {};
  filtrirani.forEach(p=>{
    if(!poKat[p.kat]) poKat[p.kat]={naziv:p.kat, proizvodi:[]};
    poKat[p.kat].proizvodi.push(p);
  });

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{background:"linear-gradient(135deg,#1C1A17,#2A2318)",borderRadius:14,padding:"16px 20px"}}>
        <div style={{color:"#E8A020",fontFamily:"Georgia,serif",fontSize:18,fontWeight:800}}>📐 Normativi — Recepture</div>
        <div style={{color:"rgba(255,255,255,.6)",fontSize:12,marginTop:4}}>
          {(data.normativi||[]).length}/{sviP.length} proizvoda ima normativ
        </div>
      </div>

      <input placeholder="🔍 Pretraži..." value={filter} onChange={e=>setFilter(e.target.value)} style={S.input}/>

      {Object.values(poKat).map(kat=>(
        <div key={kat.naziv}>
          <div style={{fontWeight:800,fontSize:12,color:"#C8860A",padding:"4px 0",borderBottom:"2px solid #E8D5A0",marginBottom:8}}>{kat.naziv}</div>
          {kat.proizvodi.map(prod=>{
            const norm = (data.normativi||[]).find(n=>n.prodId===prod.id);
            const trosak = getCijenuProizvoda(prod.id, data);
            const cijP = data.cijene&&data.cijene[prod.id]?data.cijene[prod.id].maloprodaja||0:0;
            const marza = cijP>0&&trosak!=null ? Math.round(((cijP-trosak)/cijP)*100) : null;
            return (
              <div key={prod.id} style={{background:"white",borderRadius:10,padding:"10px 14px",border:"1px solid "+(norm?"#C8E6C9":"#F0E0C8"),display:"flex",alignItems:"center",gap:10,marginBottom:6,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:120}}>
                  <div style={{fontWeight:700,fontSize:13}}>{prod.naziv}</div>
                  {norm&&<div style={{fontSize:11,color:"#5A4A35",marginTop:2}}>{norm.stavke.map(s=>s.kolicina+" "+s.jm+" "+s.naziv).join(" · ")}</div>}
                  {trosak!=null&&(
                    <div style={{fontSize:11,marginTop:2,display:"flex",gap:8}}>
                      <span style={{color:"#C00000",fontWeight:700}}>Trošak: {trosak.toFixed(2)} RSD</span>
                      {marza!==null&&<span style={{color:marza>=30?"#107C41":marza>=0?"#C8860A":"#C00000",fontWeight:700}}>Marža: {marza}%</span>}
                    </div>
                  )}
                </div>
                <div style={{display:"flex",gap:6}}>
                  {norm
                    ? <span style={{background:"#E8F5E9",color:"#107C41",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20}}>✅ {norm.stavke.length} sir.</span>
                    : <span style={{background:"#FFF3E0",color:"#C8860A",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20}}>⚠️ Nema</span>
                  }
                  {perms.canEdit&&(
                    <button onClick={()=>otvoriEditor(prod)} style={{padding:"5px 12px",borderRadius:8,border:"1px solid #C8860A",background:"#FFF8DC",color:"#C8860A",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                      {norm?"✏️ Uredi":"➕ Dodaj"}
                    </button>
                  )}
                  {norm&&perms.canEdit&&(
                    <button onClick={()=>obrisi(prod.id)} style={{padding:"5px 8px",borderRadius:8,border:"1px solid #FFCCCC",background:"#FFF0F0",color:"#C00000",fontSize:12,cursor:"pointer"}}>🗑️</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      ))}

      {showForm&&selProd&&(
        <Modal title={"📐 Normativ — "+selProd.naziv} onClose={()=>setShowForm(false)}>
          <p style={{fontSize:12,color:"#7A6545",margin:"0 0 12px"}}>Koliko svake sirovine ide u <b>1 komad</b>.</p>
          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
            {stavke.map((st,i)=>{
              const sir=(data.sirovine||[]).find(x=>x.id===+st.siroId);
              const cijSt=sir&&+st.kolicina>0?+st.kolicina*(sir.cena||0):0;
              return(
                <div key={i} style={{display:"flex",gap:6,alignItems:"center",background:"#FAFAF5",padding:"8px",borderRadius:8,border:"1px solid #E8DECA"}}>
                  <select value={st.siroId} onChange={e=>izmijeniStavku(i,"siroId",e.target.value)} style={{...S.input,flex:2,fontSize:12}}>
                    <option value="">— Sirovina —</option>
                    {(data.sirovine||[]).map(s=><option key={s.id} value={s.id}>{s.naziv} ({s.jm})</option>)}
                  </select>
                  <input type="number" min="0" step="0.001" placeholder="Kol." value={st.kolicina}
                    onChange={e=>izmijeniStavku(i,"kolicina",e.target.value)}
                    style={{...S.input,width:80,textAlign:"right"}}/>
                  <span style={{fontSize:11,color:"#7A6545",width:24}}>{st.jm}</span>
                  {cijSt>0&&<span style={{fontSize:11,color:"#C00000",width:55,textAlign:"right"}}>{cijSt.toFixed(2)}</span>}
                  <button onClick={()=>ukloniStavku(i)} style={{padding:"4px 8px",borderRadius:6,border:"1px solid #FFCCCC",background:"#FFF0F0",color:"#C00000",cursor:"pointer"}}>✕</button>
                </div>
              );
            })}
          </div>
          <button onClick={dodajStavku} style={{width:"100%",padding:"8px",borderRadius:8,border:"2px dashed #C8860A",background:"#FFF8DC",color:"#C8860A",fontWeight:700,cursor:"pointer",marginBottom:14}}>
            ➕ Dodaj sirovinu
          </button>
          <div style={{background:"#F5F0E8",borderRadius:10,padding:"10px 14px",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
              <span style={{color:"#7A6545"}}>Trošak/kom:</span>
              <span style={{fontWeight:800,color:"#C00000"}}>{trosakEditora.toFixed(2)} RSD</span>
            </div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <Btn icon="✅" label="Sačuvaj" onClick={sacuvaj} color="#107C41" full/>
            <Btn icon="✕" label="Otkaži" onClick={()=>setShowForm(false)} color="#7A6545" full/>
          </div>
        </Modal>
      )}
    </div>
  );
}


function UpravljanjeProizvodima({data,persist}) {
  const kategorije = getKat(data);
  const [showKat,setShowKat] = useState(false);
  const [showProd,setShowProd] = useState(false);
  const [editKat,setEditKat] = useState(null);   // null = novo, obj = edit
  const [editProd,setEditProd] = useState(null);  // {katId, prod|null}
  const [katForm,setKF] = useState({id:"",naziv:"",icon:"🍽️",boja:"#C8860A",direktna:false});
  const [prodForm,setPF] = useState({id:"",naziv:""});
  const [dragKat,setDragKat] = useState(null);

  // ── Helpers ──────────────────────────────────────────────────────
  const saveKat = () => {
    if(!katForm.naziv.trim()){alert("Unesite naziv kategorije!");return;}
    let kat = [...kategorije];
    if(editKat){
      kat = kat.map(k=>k.id===editKat.id?{...k,...katForm,direktna:katForm.direktna==="true"||katForm.direktna===true}:k);
    } else {
      const newId = "kat_" + Date.now();
      kat = [...kat, {id:newId, naziv:katForm.naziv, icon:katForm.icon, boja:katForm.boja, direktna:katForm.direktna==="true"||katForm.direktna===true, proizvodi:[]}];
    }
    persist({...data, kategorije:kat, stanjeLokala:rebuildStanje(kat, data.stanjeLokala)});
    setShowKat(false); setEditKat(null);
  };

  const deleteKat = (katId) => {
    const kat = kategorije.find(k=>k.id===katId);
    if(!window.confirm(`Obrisati kategoriju "${kat?.naziv}" i sve njene proizvode? Ovo se ne može poništiti!`)) return;
    persist({...data, kategorije: kategorije.filter(k=>k.id!==katId)});
  };

  const saveProd = () => {
    if(!prodForm.naziv.trim()){alert("Unesite naziv proizvoda!");return;}
    let kat = [...kategorije];
    if(editProd.prod){
      // edit existing
      kat = kat.map(k=>k.id===editProd.katId ? {...k, proizvodi:k.proizvodi.map(p=>p.id===editProd.prod.id?{...p,naziv:prodForm.naziv}:p)} : k);
    } else {
      // new product
      const newId = "p_" + Date.now();
      kat = kat.map(k=>k.id===editProd.katId ? {...k, proizvodi:[...k.proizvodi,{id:newId,naziv:prodForm.naziv}]} : k);
      // Add stanje entries for new product
      const novoStanje = [...(data.stanjeLokala||[])];
      Object.keys(LOKALI).forEach(lok=>{
        novoStanje.push({id:Date.now()+Math.random(),prodId:newId,lokacija:lok,kolicina:0});
      });
      persist({...data, kategorije:kat, stanjeLokala:novoStanje});
      setShowProd(false); setEditProd(null);
      return;
    }
    persist({...data, kategorije:kat});
    setShowProd(false); setEditProd(null);
  };

  const deleteProd = (katId, prodId) => {
    const p = kategorije.find(k=>k.id===katId)?.proizvodi.find(x=>x.id===prodId);
    if(!window.confirm(`Obrisati proizvod "${p?.naziv}"? Ovo briše i sva stanja za ovaj proizvod.`)) return;
    const kat = kategorije.map(k=>k.id===katId?{...k,proizvodi:k.proizvodi.filter(x=>x.id!==prodId)}:k);
    persist({...data, kategorije:kat, stanjeLokala:(data.stanjeLokala||[]).filter(s=>s.prodId!==prodId)});
  };

  const moveProd = (katId, prodId, dir) => {
    const kat = kategorije.map(k=>{
      if(k.id!==katId) return k;
      const arr=[...k.proizvodi]; const i=arr.findIndex(x=>x.id===prodId);
      const j=i+dir; if(j<0||j>=arr.length) return k;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      return {...k,proizvodi:arr};
    });
    persist({...data,kategorije:kat});
  };

  const moveKat = (katId, dir) => {
    const arr=[...kategorije]; const i=arr.findIndex(k=>k.id===katId);
    const j=i+dir; if(j<0||j>=arr.length) return;
    [arr[i],arr[j]]=[arr[j],arr[i]];
    persist({...data,kategorije:arr});
  };

  const resetToDefault = () => {
    if(!window.confirm("Vratiti na originalni spisak proizvoda? Vaše izmjene bit će izgubljene!")) return;
    persist({...data, kategorije:[], stanjeLokala:genStanje()});
  };

  // rebuild stanje for new kategorije
  const rebuildStanje = (kat, existing) => {
    const existing_ = existing||[];
    const newSt = [...existing_];
    kat.forEach(k=>k.proizvodi.forEach(p=>{
      Object.keys(LOKALI).forEach(lok=>{
        if(!existing_.find(s=>s.prodId===p.id&&s.lokacija===lok)){
          newSt.push({id:Date.now()+Math.random(),prodId:p.id,lokacija:lok,kolicina:0});
        }
      });
    }));
    return newSt;
  };

  const IKONE = ["🥟","🥙","🥐","🍮","🥤","🍕","🥗","🧆","🍞","🥜","🧁","🍰","☕","🫙","🧃","🍫","🫓","🥧"];
  const BOJE  = ["#C8860A","#8B4513","#C0392B","#1565C0","#107C41","#6A1B9A","#D4A017","#1C1A17","#E67E22","#2C3E50"];

  const totalProizvodi = kategorije.reduce((s,k)=>s+k.proizvodi.length,0);

  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      {/* Info bar */}
      <div style={{background:"#FFF8DC",border:"1px solid #E8D5A0",borderRadius:12,padding:"14px 18px",fontSize:13,color:"#5A4A35",lineHeight:1.7}}>
        <b>🛒 Upravljanje Proizvodima</b> — Dodajte, uredite ili obrišite kategorije i proizvode.<br/>
        Promjene su odmah vidljive svim korisnicima. Trenutno: <b>{kategorije.length} kategorija</b>, <b>{totalProizvodi} proizvoda</b>.
      </div>

      {/* Action buttons */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <Btn icon="➕" label="Nova Kategorija" onClick={()=>{setEditKat(null);setKF({id:"",naziv:"",icon:"🍽️",boja:"#C8860A",direktna:false});setShowKat(true);}} color="#1C1A17"/>
        <button onClick={resetToDefault} style={{...S.btn2,fontSize:11,padding:"8px 12px",color:"#C00000",background:"#FFF0F0",border:"1px solid #FFCCCC"}}>↺ Originalni</button>
      </div>

      {/* Categories list */}
      {kategorije.map((kat,ki)=>(
        <div key={kat.id} style={{background:"white",borderRadius:14,border:"1px solid #E8DECA",overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,.05)"}}>
          {/* Category header */}
          <div style={{background:"#1C1A17",padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:22}}>{kat.icon}</span>
            <div style={{flex:1}}>
              <span style={{color:"white",fontWeight:700,fontSize:15}}>{kat.naziv}</span>
              <span style={{color:"rgba(255,255,255,.5)",fontSize:11,marginLeft:10}}>{kat.proizvodi.length} proizvoda</span>
              {kat.direktna&&<Tag bg="#E8F5E9" color="#107C41" style={{marginLeft:8}}>📥 Direktna dostava</Tag>}
            </div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              <button onClick={()=>moveKat(kat.id,-1)} disabled={ki===0} style={{...S.btn2,background:"rgba(255,255,255,.1)",color:"white",border:"none",padding:"5px 8px",opacity:ki===0?.3:1}}>↑</button>
              <button onClick={()=>moveKat(kat.id,+1)} disabled={ki===kategorije.length-1} style={{...S.btn2,background:"rgba(255,255,255,.1)",color:"white",border:"none",padding:"5px 8px",opacity:ki===kategorije.length-1?.3:1}}>↓</button>
              <button onClick={()=>{setEditKat(kat);setKF({id:kat.id,naziv:kat.naziv,icon:kat.icon,boja:kat.boja,direktna:kat.direktna});setShowKat(true);}} style={{...S.btn2,background:"rgba(255,255,255,.15)",color:"white",border:"none",padding:"5px 8px",fontSize:13}}>✏️</button>
              <button onClick={()=>deleteKat(kat.id)} style={{...S.btn2,background:"rgba(220,0,0,.2)",color:"#ffaaaa",border:"none",padding:"5px 8px",fontSize:13}}>🗑️</button>
              <button onClick={()=>{setEditProd({katId:kat.id,prod:null});setPF({id:"",naziv:""});setShowProd(true);}} style={{background:"#E8A020",color:"white",border:"none",borderRadius:8,padding:"6px 10px",fontSize:12,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}><span>➕</span> Dodaj</button>
            </div>
          </div>
          {/* Products list */}
          <div style={{padding:"10px 12px"}}>
            {kat.proizvodi.length===0&&<p style={{color:"#B0A090",fontSize:12,textAlign:"center",padding:"10px 0",fontStyle:"italic"}}>Nema proizvoda — kliknite "Dodaj Proizvod" iznad</p>}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:8}}>
              {kat.proizvodi.map((p,pi)=>(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:"#FAFAF8",borderRadius:8,border:"1px solid #EEE2D0"}}>
                  <span style={{fontSize:14,color:kat.boja,flexShrink:0}}>•</span>
                  <span style={{flex:1,fontSize:13,fontWeight:600,color:"#1C1A17"}}>{p.naziv}</span>
                  <div style={{display:"flex",gap:3,flexShrink:0}}>
                    <button onClick={()=>moveProd(kat.id,p.id,-1)} disabled={pi===0} style={{background:"none",border:"none",cursor:"pointer",color:"#C8A050",padding:"2px 4px",opacity:pi===0?.3:1,fontSize:12}}>↑</button>
                    <button onClick={()=>moveProd(kat.id,p.id,+1)} disabled={pi===kat.proizvodi.length-1} style={{background:"none",border:"none",cursor:"pointer",color:"#C8A050",padding:"2px 4px",opacity:pi===kat.proizvodi.length-1?.3:1,fontSize:12}}>↓</button>
                    <button onClick={()=>{setEditProd({katId:kat.id,prod:p});setPF({naziv:p.naziv});setShowProd(true);}} style={{background:"none",border:"none",cursor:"pointer",color:"#C8A050",padding:"2px 5px",fontSize:14}}>✏️</button>
                    <button onClick={()=>deleteProd(kat.id,p.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#C00000",padding:"2px 5px",fontSize:14}}>✕</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      ))}

      {kategorije.length===0&&(
        <div style={{background:"white",borderRadius:14,border:"2px dashed #E8DECA",padding:"40px 20px",textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:10}}>🛒</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:16,color:"#5A4A35",marginBottom:6}}>Nema kategorija</div>
          <div style={{fontSize:13,color:"#9A8A75",marginBottom:16}}>Kliknite "Nova Kategorija" ili "Vrati na originalne" da počnete.</div>
          <Btn icon="↺" label="Vrati originalne proizvode" onClick={resetToDefault} color="#C8860A"/>
        </div>
      )}

      {/* Kategorija modal */}
      {showKat&&<Modal title={editKat?"✏️ Uredi Kategoriju":"➕ Nova Kategorija"} onClose={()=>{setShowKat(false);setEditKat(null);}}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><label style={S.label}>Naziv Kategorije</label>
            <input value={katForm.naziv} onChange={e=>setKF(f=>({...f,naziv:e.target.value}))} style={S.input} placeholder="npr. Mantije, Pite, Pića..."/></div>
          <div><label style={S.label}>Ikona</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:4}}>
              {IKONE.map(ic=><button key={ic} onClick={()=>setKF(f=>({...f,icon:ic}))} style={{width:38,height:38,borderRadius:8,border:`2px solid ${katForm.icon===ic?"#E8A020":"#E8DECA"}`,background:katForm.icon===ic?"#FFF8DC":"white",fontSize:20,cursor:"pointer"}}>{ic}</button>)}
              <input value={katForm.icon} onChange={e=>setKF(f=>({...f,icon:e.target.value}))} style={{...S.input,width:60,textAlign:"center",fontSize:20}} maxLength={2}/>
            </div>
          </div>
          <div><label style={S.label}>Boja</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:4}}>
              {BOJE.map(b=><button key={b} onClick={()=>setKF(f=>({...f,boja:b}))} style={{width:32,height:32,borderRadius:"50%",border:`3px solid ${katForm.boja===b?"#1C1A17":"transparent"}`,background:b,cursor:"pointer"}}/>)}
              <input type="color" value={katForm.boja} onChange={e=>setKF(f=>({...f,boja:e.target.value}))} style={{width:40,height:32,borderRadius:8,border:"1px solid #E8DECA",cursor:"pointer",padding:2}}/>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:12,background:"#F9F7F2",borderRadius:10,padding:"10px 14px"}}>
            <input type="checkbox" id="direktna_cb" checked={katForm.direktna===true||katForm.direktna==="true"} onChange={e=>setKF(f=>({...f,direktna:e.target.checked}))} style={{width:18,height:18,cursor:"pointer"}}/>
            <label htmlFor="direktna_cb" style={{cursor:"pointer",fontSize:13,color:"#1C1A17"}}>
              <b>Direktna dostava</b> — roba stiže direktno od dobavljača u lokal (npr. Pića), ne prolazi kroz Proizvodnju
            </label>
          </div>
          <div style={{background:"#E8F5E9",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#107C41"}}>
            Pregled: <span style={{color:katForm.boja,fontWeight:700,fontSize:15}}>{katForm.icon} {katForm.naziv||"Nova kategorija"}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:18}}>
          <Btn icon="💾" label="Sačuvaj Kategoriju" onClick={saveKat} color="#1C1A17" full/>
          <Btn icon="✕" label="Otkaži" onClick={()=>{setShowKat(false);setEditKat(null);}} color="#7A6545" full/>
        </div>
      </Modal>}

      {/* Proizvod modal */}
      {showProd&&editProd&&<Modal title={editProd.prod?"✏️ Uredi Proizvod":"➕ Novi Proizvod"} onClose={()=>{setShowProd(false);setEditProd(null);}}>
        <div style={{background:"#FFF8DC",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#5A4A35",marginBottom:14}}>
          Kategorija: <b>{getKat(data).find(k=>k.id===editProd.katId)?.icon} {getKat(data).find(k=>k.id===editProd.katId)?.naziv}</b>
        </div>
        <label style={S.label}>Naziv Proizvoda</label>
        <input value={prodForm.naziv} onChange={e=>setPF(f=>({...f,naziv:e.target.value}))} style={{...S.input,marginBottom:18,fontSize:16}} placeholder="npr. Mantija Špinat, Pita Tikva..." onKeyDown={e=>e.key==="Enter"&&saveProd()}/>
        <div style={{display:"flex",gap:10}}>
          <Btn icon="💾" label={editProd.prod?"Sačuvaj Izmjene":"Dodaj Proizvod"} onClick={saveProd} color="#1C1A17" full/>
          <Btn icon="✕" label="Otkaži" onClick={()=>{setShowProd(false);setEditProd(null);}} color="#7A6545" full/>
        </div>
      </Modal>}
    </div>
  );
}


// ── ADMIN PANEL (Direktor — upravljanje podacima) ────────────────
function AdminPanel({data, persist, addLog, session, korisnici}) {
  const [show, setShow] = useState(false);
  const [tab,  setTab]  = useState("dostave");
  const [potvrda, setPotvrda] = useState(null);

  const obrisiDostavу = (d) => {
    const lok = LOKALI[d.lokacija];
    let ns = [...(data.stanjeLokala||[])];
    d.stavke.forEach(st => {
      ns = ns.map(s =>
        s.prodId===st.prodId && s.lokacija==="proizvodnja" ? {...s, kolicina:s.kolicina+st.kolicina} :
        s.prodId===st.prodId && s.lokacija===d.lokacija    ? {...s, kolicina:Math.max(0,s.kolicina-st.kolicina)} :
        s
      );
    });
    persist(addLog(
      {...data, stanjeLokala:ns, dostave:(data.dostave||[]).filter(x=>x.id!==d.id)},
      `ADMIN brisanje dostave #${d.id} — ${lok.naziv} (${session.ime})`
    ));
    setPotvrda(null);
  };

  const obrisiZaklucak = (z) => {
    persist(addLog(
      {...data, zaklucakSmjene:(data.zaklucakSmjene||[]).filter(x=>x.id!==z.id)},
      `ADMIN brisanje zaključka #${z.id} — ${z.lokNaziv} (${session.ime})`
    ));
    setPotvrda(null);
  };

  const resetujStanje = (lokacija) => {
    const lok = LOKALI[lokacija];
    const ns = (data.stanjeLokala||[]).map(s =>
      s.lokacija===lokacija ? {...s, kolicina:0} : s
    );
    persist(addLog(
      {...data, stanjeLokala:ns},
      `ADMIN reset stanja — ${lok.naziv} sve na 0 (${session.ime})`
    ));
    setPotvrda(null);
  };

  const dostave = data.dostave||[];
  const zaklucaci = data.zaklucakSmjene||[];

  return (
    <>
      <button onClick={()=>setShow(true)}
        style={{position:"fixed",bottom:20,right:20,zIndex:9999,
          background:"#1C1A17",color:"white",border:"2px solid #E8A020",
          borderRadius:"50%",width:52,height:52,fontSize:22,cursor:"pointer",
          boxShadow:"0 4px 16px rgba(0,0,0,.4)",display:"flex",alignItems:"center",justifyContent:"center"}}
        title="Admin Panel">⚙️</button>

      {show&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div style={{background:"white",borderRadius:18,width:"100%",maxWidth:700,maxHeight:"90vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {/* Header */}
          <div style={{background:"#1C1A17",padding:"16px 20px",display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:24}}>⚙️</span>
            <div style={{flex:1}}>
              <div style={{color:"white",fontWeight:700,fontSize:16}}>Admin Panel</div>
              <div style={{color:"rgba(255,255,255,.5)",fontSize:11}}>Brisanje i korekcija podataka — samo Direktor</div>
            </div>
            <button onClick={()=>{setShow(false);setPotvrda(null);}} style={{background:"rgba(255,255,255,.1)",border:"none",color:"white",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:14}}>✕ Zatvori</button>
          </div>

          {/* Tabs */}
          <div style={{display:"flex",gap:2,padding:"10px 16px",background:"#F5F0E8",borderBottom:"1px solid #E8DECA"}}>
            {[
              {k:"dostave",   l:"🚚 Dostave",        n:dostave.length},
              {k:"zaklucaci", l:"🏁 Zaključci",      n:zaklucaci.length},
              {k:"stanje",    l:"📦 Reset Stanja",   n:null},
              {k:"backup",    l:"💾 Backup",          n:null},
            ].map(t=>(
              <button key={t.k} onClick={()=>{setTab(t.k);setPotvrda(null);}}
                style={{padding:"7px 14px",borderRadius:8,border:"none",background:tab===t.k?"#1C1A17":"transparent",
                  color:tab===t.k?"white":"#5A4A35",fontWeight:tab===t.k?700:400,cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",gap:6}}>
                {t.l}{t.n!==null&&<span style={{background:tab===t.k?"rgba(255,255,255,.2)":"#E8DECA",borderRadius:12,padding:"1px 7px",fontSize:10}}>{t.n}</span>}
              </button>
            ))}
          </div>

          {/* Content */}
          <div style={{flex:1,overflowY:"auto",padding:16}}>

            {/* DOSTAVE */}
            {tab==="dostave"&&(
              <div>
                <div style={{background:"#FFF0F0",border:"1px solid #FFCCCC",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#C00000",marginBottom:14}}>
                  ⚠️ Brisanje dostave <b>vraća robu u Proizvodnju</b> i briše zapis iz historije.
                </div>
                {dostave.length===0
                  ? <p style={{color:"#7A6545",textAlign:"center",padding:20}}>Nema dostava.</p>
                  : dostave.map((d,i)=>{
                      const lok = LOKALI[d.lokacija];
                      const ukupno = d.stavke.reduce((s,x)=>s+x.kolicina,0);
                      const isConf = potvrda===`d${d.id}`;
                      return(
                      <div key={d.id} style={{marginBottom:8,borderRadius:10,border:`1px solid ${isConf?"#C00000":"#E8DECA"}`,overflow:"hidden",background:"white"}}>
                        <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px"}}>
                          <div style={{flex:1}}>
                            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:3}}>
                              <Tag bg={lok.bg} color={lok.boja}>{lok.icon} {lok.naziv}</Tag>
                              <Tag bg="#FAF6EE" color="#7A6545">{d.datum} {d.vreme}</Tag>
                              <Tag bg="#E8F5E9" color="#107C41">{fmtN(ukupno)} kom</Tag>
                            </div>
                            <div style={{fontSize:11,color:"#9A8A75"}}>
                              {d.stavke.slice(0,3).map(s=>{const p=getSviP(data).find(x=>x.id===s.prodId);return`${p?.naziv||s.prodId}(${s.kolicina})`}).join(", ")}
                              {d.stavke.length>3&&"..."} · {d.korisnik}
                            </div>
                          </div>
                          <button onClick={()=>setPotvrda(isConf?null:`d${d.id}`)}
                            style={{padding:"7px 14px",borderRadius:8,border:`1px solid ${isConf?"#C00000":"#FFCCCC"}`,background:isConf?"#FFF0F0":"white",color:"#C00000",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>
                            {isConf?"▲ Otkaži":"🗑️ Obriši"}
                          </button>
                        </div>
                        {isConf&&(
                          <div style={{background:"#FFF0F0",borderTop:"1px solid #FFCCCC",padding:"12px 16px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                            <div style={{flex:1,fontSize:13,color:"#C00000"}}>
                              <b>Sigurno?</b> Roba se vraća u Proizvodnju. Ne može se poništiti!
                            </div>
                            <button onClick={()=>obrisiDostavу(d)}
                              style={{background:"#C00000",color:"white",border:"none",borderRadius:8,padding:"8px 18px",fontWeight:700,cursor:"pointer",fontSize:13}}>
                              ✅ Da, obriši
                            </button>
                          </div>
                        )}
                      </div>);
                    })
                }
              </div>
            )}

            {/* ZAKLJUČCI */}
            {tab==="zaklucaci"&&(
              <div>
                <div style={{background:"#FFF8DC",border:"1px solid #E8D5A0",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#5A4A35",marginBottom:14}}>
                  ℹ️ Brisanje zaključka ne mijenja stanje robe — samo briše zapis.
                </div>
                {zaklucaci.length===0
                  ? <p style={{color:"#7A6545",textAlign:"center",padding:20}}>Nema zaključaka.</p>
                  : zaklucaci.map((z,i)=>{
                      const lok = LOKALI[z.lokacija]||{naziv:z.lokNaziv,icon:"📍",boja:"#999",bg:"#eee"};
                      const isConf = potvrda===`z${z.id}`;
                      return(
                      <div key={z.id} style={{marginBottom:8,borderRadius:10,border:`1px solid ${isConf?"#C00000":"#E8DECA"}`,overflow:"hidden",background:"white"}}>
                        <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px"}}>
                          <div style={{flex:1}}>
                            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:3}}>
                              <Tag bg={lok.bg} color={lok.boja}>{lok.icon} {lok.naziv}</Tag>
                              <Tag bg="#FAF6EE" color="#7A6545">{z.datum}</Tag>
                              <Tag bg="#FFF8DC" color="#C8860A">{z.smjena==="jutarnja"?"☀️ Jutarnja":z.smjena==="soljica"?"📤 Šoljica":"🌙 Posl."}</Tag>
                            </div>
                            <div style={{fontSize:11,color:"#9A8A75"}}>{z.korisnik} · Blagajna: {fmtN(z.blagajna)} RSD</div>
                          </div>
                          <button onClick={()=>setPotvrda(isConf?null:`z${z.id}`)}
                            style={{padding:"7px 14px",borderRadius:8,border:`1px solid ${isConf?"#C00000":"#FFCCCC"}`,background:isConf?"#FFF0F0":"white",color:"#C00000",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>
                            {isConf?"▲ Otkaži":"🗑️ Obriši"}
                          </button>
                        </div>
                        {isConf&&(
                          <div style={{background:"#FFF0F0",borderTop:"1px solid #FFCCCC",padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                            <div style={{flex:1,fontSize:13,color:"#C00000"}}><b>Sigurno?</b></div>
                            <button onClick={()=>obrisiZaklucak(z)}
                              style={{background:"#C00000",color:"white",border:"none",borderRadius:8,padding:"8px 18px",fontWeight:700,cursor:"pointer"}}>
                              ✅ Da, obriši
                            </button>
                          </div>
                        )}
                      </div>);
                    })
                }
              </div>
            )}

            {/* RESET STANJA */}
            {tab==="stanje"&&(
              <div>
                <div style={{background:"#FFF0F0",border:"2px solid #FFCCCC",borderRadius:10,padding:"12px 16px",fontSize:13,color:"#C00000",marginBottom:16}}>
                  ⚠️ <b>Opasno!</b> Reset postavlja SVE količine u lokalu na 0. Koristiti samo na početku smjene ili pri grešci.
                </div>
                {["mama1","mama2","proizvodnja"].map(lok=>{
                  const li = LOKALI[lok];
                  const isConf = potvrda===`reset_${lok}`;
                  const ukupnoKom = (data.stanjeLokala||[]).filter(s=>s.lokacija===lok).reduce((s,x)=>s+x.kolicina,0);
                  return(
                  <div key={lok} style={{marginBottom:10,borderRadius:10,border:`2px solid ${isConf?"#C00000":"#E8DECA"}`,background:"white",padding:"14px 16px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:15,color:li.boja}}>{li.icon} {li.naziv}</div>
                        <div style={{fontSize:12,color:"#7A6545",marginTop:2}}>Trenutno stanje: <b>{fmtN(ukupnoKom)} kom ukupno</b></div>
                      </div>
                      <button onClick={()=>setPotvrda(isConf?null:`reset_${lok}`)}
                        style={{padding:"8px 16px",borderRadius:8,border:`1px solid ${isConf?"#C00000":"#FFCCCC"}`,background:isConf?"#FFF0F0":"white",color:"#C00000",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                        {isConf?"Otkaži":"🔄 Reset na 0"}
                      </button>
                    </div>
                    {isConf&&(
                      <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #FFCCCC",display:"flex",alignItems:"center",gap:12}}>
                        <div style={{flex:1,fontSize:13,color:"#C00000"}}><b>SVE količine u {li.naziv} → 0. Sigurno?</b></div>
                        <button onClick={()=>resetujStanje(lok)}
                          style={{background:"#C00000",color:"white",border:"none",borderRadius:8,padding:"8px 18px",fontWeight:700,cursor:"pointer"}}>
                          ✅ Da, resetuj
                        </button>
                      </div>
                    )}
                  </div>);
                })}
              </div>
            )}

            {/* ── BACKUP / RESTORE ── */}
            {tab==="backup"&&(
              <div style={{display:"flex",flexDirection:"column",gap:14}}>
                <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:"12px 16px",fontSize:13,color:"#1565C0"}}>
                  💾 <b>Backup</b> preuzima sve podatke kao JSON fajl na vaš uređaj.<br/>
                  <b>Restore</b> učitava taj fajl i vraća sve podatke. <span style={{color:"#C00000",fontWeight:700}}>Trenutni podaci će biti zamijenjeni!</span>
                </div>

                <div style={{background:"white",borderRadius:12,border:"1px solid #E8DECA",padding:"16px"}}>
                  <div style={{fontWeight:700,fontSize:14,marginBottom:6}}>📤 Preuzmi Backup</div>
                  <div style={{fontSize:12,color:"#7A6545",marginBottom:12}}>
                    Kreira JSON fajl sa svim podacima — dostave, zaključci, sirovine, cijene, normativi...
                  </div>
                  <button onClick={()=>{
                    const backup={verzija:"1.0",datum:new Date().toISOString(),aplikacija:"Mama Mantia",data:data,korisnici:korisnici};
                    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
                    const url=URL.createObjectURL(blob);
                    const a=document.createElement("a");
                    a.href=url; a.download="MamaMantia_backup_"+today()+".json"; a.click();
                    URL.revokeObjectURL(url);
                  }} style={{background:"#1565C0",color:"white",border:"none",borderRadius:10,padding:"12px 24px",
                    fontSize:14,fontWeight:700,cursor:"pointer",width:"100%",textAlign:"center"}}>
                    📥 Preuzmi Backup — {today()}
                  </button>
                </div>

                <div style={{background:"#F0FFF4",border:"1px solid #BBF7D0",borderRadius:10,padding:"12px 16px",fontSize:12,color:"#107C41"}}>
                  ✅ <b>Firebase automatski čuva sve promjene u realnom vremenu.</b><br/>
                  Preporučujemo jednom sedmično preuzeti ručni backup za dodatnu sigurnost.
                </div>

                <div style={{background:"white",borderRadius:12,border:"2px solid #FFCCCC",padding:"16px"}}>
                  <div style={{fontWeight:700,fontSize:14,marginBottom:6,color:"#C00000"}}>⚠️ Restore iz Backupa</div>
                  <div style={{fontSize:12,color:"#7A6545",marginBottom:12}}>
                    Učitajte prethodno preuzeti backup fajl. <b style={{color:"#C00000"}}>Svi trenutni podaci će biti izgubljeni!</b>
                  </div>
                  <input type="file" accept=".json" id="mm-restore-file" style={{display:"none"}}
                    onChange={(e)=>{
                      const file=e.target.files[0]; if(!file) return;
                      const reader=new FileReader();
                      reader.onload=(ev)=>{
                        try {
                          const backup=JSON.parse(ev.target.result);
                          if(!backup.data||!backup.aplikacija){alert("❌ Nevažeći backup fajl!");return;}
                          if(!window.confirm("⚠️ SIGURNO? Zamijeniće SVE podatke backupom od: "+(backup.datum||"nepoznato")+". Ova akcija se NE MOŽE PONIŠTITI!")) return;
                          persist(backup.data);
                          alert("✅ Restore uspješan!");
                          setTimeout(()=>window.location.reload(),1000);
                        } catch(err){alert("❌ Greška: "+err.message);}
                        e.target.value="";
                      };
                      reader.readAsText(file);
                    }}
                  />
                  <button onClick={()=>document.getElementById("mm-restore-file").click()}
                    style={{background:"#FFF0F0",color:"#C00000",border:"2px solid #FFCCCC",borderRadius:10,
                      padding:"12px 24px",fontSize:14,fontWeight:700,cursor:"pointer",width:"100%",textAlign:"center"}}>
                    📂 Odaberi Backup Fajl za Restore...
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>}
    </>
  );
}

// ── SHARED UI ─────────────────────────────────────────────────────
function Card({title,children}){return <div style={{background:"white",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(74,44,10,.07)",border:"1px solid #E8DECA"}}>{title&&<h3 style={{margin:"0 0 14px",fontFamily:"Georgia,serif",fontSize:14,color:"#1C1A17",borderBottom:"2px solid #E8D5A0",paddingBottom:10}}>{title}</h3>}{children}</div>;}
function Modal({title,children,onClose}){
  const mob = typeof window!=="undefined" && window.innerWidth < 768;
  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:1000,display:"flex",alignItems:mob?"flex-end":"center",justifyContent:"center",padding:mob?0:16,backdropFilter:"blur(3px)"}}>
    <div style={{background:"white",borderRadius:mob?"20px 20px 0 0":"16px",width:"100%",maxWidth:mob?"100%":580,maxHeight:mob?"92vh":"92vh",overflow:"auto",boxShadow:"0 -4px 40px rgba(0,0,0,.4)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px",borderBottom:"1px solid #E8DECA",background:"#FAF6EE",borderRadius:mob?"20px 20px 0 0":"16px 16px 0 0",position:"sticky",top:0,zIndex:1}}>
        <h2 style={{margin:0,fontSize:15,fontFamily:"Georgia,serif",color:"#1C1A17"}}>{title}</h2>
        <button onClick={onClose} style={{background:"#F0EBE0",border:"none",fontSize:16,cursor:"pointer",color:"#7A6545",borderRadius:"50%",width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      </div>
      <div style={{padding:mob?"16px":"20px"}}>{children}</div>
    </div>
  </div>;
}
function Btn({icon,label,onClick,color="#C8860A",full}){return <button onClick={onClick} style={{background:color,color:"white",border:"none",borderRadius:10,padding:"10px 16px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6,width:full?"100%":"auto",justifyContent:full?"center":undefined}}><span>{icon}</span>{label}</button>;}
function Tag({bg="#F5F5F5",color="#333",children}){return <span style={{background:bg,color,padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,display:"inline-block"}}>{children}</span>;}
function Alert({children}){return <div style={{background:"#FFF3CD",border:"1px solid #FBBF24",borderRadius:12,padding:"12px 18px",display:"flex",alignItems:"center",gap:10,color:"#92400E",fontWeight:600,fontSize:13}}>{children}</div>;}

// ── STYLES ────────────────────────────────────────────────────────
const S={
  app:{display:"flex",height:"100vh",overflow:"hidden",fontFamily:"'Segoe UI','Helvetica Neue',sans-serif",background:"#F5F0E8"},
  sidebar:{background:"linear-gradient(180deg,#0F0E0B 0%,#1C1A17 60%,#2A2318 100%)",display:"flex",flexDirection:"column",overflowY:"auto",flexShrink:0},
  main:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"},
  topbar:{background:"white",borderBottom:"1px solid #E0D5BE",padding:"12px 22px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,boxShadow:"0 1px 4px rgba(0,0,0,.06)",gap:10,flexWrap:"wrap"},
  content:{flex:1,overflowY:"auto",padding:"18px 22px",display:"flex",flexDirection:"column",gap:18},
  input:{width:"100%",padding:"9px 12px",border:"1.5px solid #E0D5BE",borderRadius:8,fontSize:13,background:"#FEFCF5",color:"#1C1A17",outline:"none",boxSizing:"border-box",fontFamily:"inherit"},
  label:{display:"block",fontSize:11,fontWeight:700,color:"#5A4A35",marginBottom:4,textTransform:"uppercase",letterSpacing:".4px"},
  th:{padding:"9px 12px",textAlign:"left",color:"white",fontWeight:600,fontSize:11,whiteSpace:"nowrap"},
  td:{padding:"8px 12px",borderBottom:"1px solid #E8DECA",verticalAlign:"middle"},
  btn2:{padding:"4px 8px",background:"#FAF6EE",border:"1px solid #E0D5BE",borderRadius:6,cursor:"pointer",fontSize:13,marginRight:3},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
