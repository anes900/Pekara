      </Card>
      {show&&<Modal title="📄 Nova Otpremnica — Prijem Robe" onClose={()=>setShow(false)}>

          <div><label style={S.label}>Broj Otpremnice</label><input value={form.brOtpremnice} onChange={e=>setF(f=>({...f,brOtpremnice:e.target.value}))} style={S.input} placeholder="npr. OTP-001"/></div>
          <div><label style={S.label}>Datum Prijema</label><input type="date" value={form.datum} onChange={e=>setF(f=>({...f,datum:e.target.value}))} style={S.input}/></div>
          <div><label style={S.label}>Dobavljač</label><select value={form.dobId} onChange={e=>setF(f=>({...f,dobId:e.target.value}))} style={S.input}><option value="">— Bez dobavljača —</option>{(data.dobavljaci||[]).filter(d=>d.status==="AKTIVAN").map(d=><option key={d.id} value={d.id}>{d.naziv}</option>)}</select></div>
          <div><label style={S.label}>Napomena</label><input value={form.napomena} onChange={e=>setF(f=>({...f,napomena:e.target.value}))} style={S.input} placeholder="Opciono..."/></div>
        </div>
        <label style={{...S.label,marginBottom:8}}>🌾 Stavke (sirovine koje su stigle)</label>
        <div style={{maxHeight:300,overflowY:"auto",marginBottom:10}}>
          {stavke.map((s,i)=>(
            <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr auto",gap:8,marginBottom:8,alignItems:"center"}}>
              <select value={s.siroId} onChange={e=>updStavka(i,"siroId",e.target.value)} style={{...S.input,fontSize:12}}>
                <option value="">— Sirovina —</option>
                {(data.sirovine||[]).map(sir=><option key={sir.id} value={sir.id}>{sir.naziv} ({sir.kolicina} {sir.jm})</option>)}
              </select>
              <input type="number" value={s.kolicina} onChange={e=>updStavka(i,"kolicina",e.target.value)} style={{...S.input,textAlign:"right"}} placeholder="Kol."/>
              <input type="number" value={s.cena} onChange={e=>updStavka(i,"cena",e.target.value)} style={{...S.input,textAlign:"right"}} placeholder="Cena RSD"/>
              <button onClick={()=>removeStavka(i)} style={{...S.btn2,color:"#C00000",background:"#FFF0F0",padding:"8px 10px"}}>✕</button>
            </div>
          ))}
        </div>
        <button onClick={addStavka} style={{...S.btn2,width:"100%",padding:10,textAlign:"center",marginBottom:14,fontSize:13}}>➕ Dodaj Stavku</button>
        <div style={{background:"#E8F5E9",borderRadius:10,padding:"10px 14px",fontSize:13,marginBottom:14,fontWeight:700,color:"#107C41"}}>
          ✅ Ukupna vrednost: {stavke.filter(s=>s.kolicina&&s.cena).reduce((s,x)=>s+(+x.kolicina)*(+x.cena),0).toLocaleString()} RSD
        </div>
        <div style={{display:"flex",gap:10}}><Btn icon="📄" label="Potvrdi Prijem" onClick={save} color="#1C1A17" full/><Btn icon="✕" label="Otkaži" onClick={()=>setShow(false)} color="#7A6545" full/></div>
      </Modal>}
    </div>
  );
}




// ── UVOZ IZ ŠOLJICE ──────────────────────────────────────────────
// Šoljica XLS struktura: A=ID, B=NazivIdx, C=Cena, D=Izlaz(prodano), E=IZNOS

// Mapa Šoljica nazivi → Mama Mantia prodId (popunjava direktor + auto-match)
const normStr = s => (s||"").toLowerCase()
  .replace(/š/g,"s").replace(/č/g,"c").replace(/ć/g,"c")
  .replace(/ž/g,"z").replace(/đ/g,"dj").replace(/dž/g,"dz")
  .replace(/[^a-z0-9 ]/g,"").trim();

// Detektuje množilac iz naziva: "10 MANTIJA" → 10, "TEPSIJA" → 120, "KG" → null
function detectMultiplier(solNaziv) {
  const n = solNaziv.toUpperCase();
  // Broj na početku: "10 MANTIJA", "5 PITA"
  const brPocetakMatch = n.match(/^(\d+)\s+/);
  if(brPocetakMatch) return parseInt(brPocetakMatch[1]);
  // Tepsija u nazivu
  if(n.includes("TEPSIJ")) return 120;
  // Kg/kilogram — označi kao kg
  if(n.match(/\bKG\b/)) return -1; // -1 = kg, poseban slučaj
  return 1; // default: 1 komad
}

function autoMatch(solNaziv, mamaProizvodi) {
  const n = normStr(solNaziv);
  // Ukloni broj s početka za matching: "10 mantija" → "mantija"
  const nClean = n.replace(/^\d+\s+/, "").replace(/tepsij[a-z]*/,"").trim();
  // 1. Exact (original)
  let m = mamaProizvodi.find(p => normStr(p.naziv) === n);
  if(m) return m.id;
  // 2. Exact (clean — bez broja/tepsija)
  m = mamaProizvodi.find(p => normStr(p.naziv) === nClean);
  if(m) return m.id;
  // 3. Contains (clean)
  m = mamaProizvodi.find(p => nClean.includes(normStr(p.naziv)) || normStr(p.naziv).includes(nClean));
  if(m) return m.id;
  // 4. Contains (original)
  m = mamaProizvodi.find(p => n.includes(normStr(p.naziv)) || normStr(p.naziv).includes(n));
  if(m) return m.id;
  // 5. Word match
  const words = nClean.split(" ").filter(w=>w.length>3);
  m = mamaProizvodi.find(p => words.some(w => normStr(p.naziv).includes(w)));
  if(m) return m.id;
  return null;
}

function parseXlsBuffer(buffer) {
  // Uses SheetJS
  if(typeof XLSX === "undefined") throw new Error("SheetJS nije učitan!");
  const wb = XLSX.read(buffer, {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});

  // First row is header: ID, Naziv, Cena, Izlaz, IZNOS, Preneto, Ulaz, Na kraju, Knjig.sifra, Popust
  const header = rows[0];
  const idxNaziv = header.indexOf("Naziv");
  const idxCena  = header.indexOf("Cena");
  const idxIzlaz = header.indexOf("Izlaz");
  const idxIznos = header.indexOf("IZNOS");

  const result = [];
  for(let i=1; i<rows.length; i++) {
    const row = rows[i];
    const naziv = String(row[idxNaziv]||"").trim();
    const cena  = parseFloat(row[idxCena])||0;
    const izlaz = parseFloat(row[idxIzlaz])||0;
    const iznos = parseFloat(row[idxIznos])||0;
    if(naziv && izlaz > 0) {
      result.push({naziv, cena, izlaz, iznos});
    }
  }
  return result;
}

function UvozSoljica({data, persist, session, myLokal, addLog}) {
  const [fajlovi, setFajlovi]     = useState({kuhinja:null, sank:null});
  const [parsed,  setParsed]      = useState({kuhinja:[], sank:[]});
  const [mapping, setMapping]     = useState({}); // solNaziv → mamaProdId
  const [step,    setStep]        = useState(1);  // 1=upload, 2=mapiranje, 3=pregled, 4=uvezeno
  const [selLok,  setSelL]        = useState(myLokal&&myLokal!=="proizvodnja"?myLokal:"mama1");
  const [error,   setError]       = useState("");
  const [loading, setLoading]     = useState(false);
  const [uvezena, setUvezena]     = useState(null);
  const [selDate, setSelDate]     = useState(today());

  const mamaProizvodi = getSviP(data);

  // Sve Šoljica stavke (iz oba fajla)
  const sveSolStavke = [...parsed.kuhinja, ...parsed.sank];

  const handleFile = (tip, file) => {
    if(!file) return;
    setError("");
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const buf = new Uint8Array(e.target.result);
        const rows = parseXlsBuffer(buf);
        setParsed(p => ({...p, [tip]:rows}));
        // Auto-match
        const newMap = {...mapping};
        rows.forEach(row => {
          if(!newMap[row.naziv]) {
            const matchId = autoMatch(row.naziv, mamaProizvodi);
            const kol = detectMultiplier(row.naziv);
            newMap[row.naziv] = { prodId: matchId||"", kol: kol===1?1:kol };
          }
        });
        setMapping(newMap);
        setFajlovi(f => ({...f, [tip]:file.name}));
      } catch(err) {
        setError("Greška pri čitanju fajla: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const ukupnoSol = sveSolStavke.reduce((s,x)=>s+x.iznos, 0);
  const ukupnoKom = sveSolStavke.reduce((s,x)=>s+x.izlaz, 0);
  const neMapirano = sveSolStavke.filter(s=>!mapping[s.naziv]?.prodId).length;

  const potvrdiUvoz = () => {
    // Gradi zaključak smjene iz uvezenih podataka
    const lok = LOKALI[selLok];
    const stavke = sveSolStavke.map(s => {
      const mapEntry = mapping[s.naziv]||{};
      const prodId = mapEntry.prodId||null;
      const kol = mapEntry.kol||1;  // množilac: 10 za "10 mantija", 120 za tepsiju
      const p = mamaProizvodi.find(x=>x.id===prodId);
      const stanjeProd = (data.stanjeLokala||[]).find(x=>x.prodId===prodId&&x.lokacija===selLok);
      const raspolozivo = stanjeProd?.kolicina||0;
      // Stvarno prodano komada = Šoljica izlaz × množilac
      const prodanoKomada = s.izlaz * kol;
      const krajnje = Math.max(0, raspolozivo - prodanoKomada);
      return {
        prodId,
        naziv: p?.naziv||s.naziv,
        solNaziv: s.naziv,
        kat: p?.kat||"—",
        pocetno: 0,
        dostavljeno: 0,
        raspolozivo,
        krajnje,
        prodano: prodanoKomada,
        solIzlaz: s.izlaz,
        kol,
        cena: kol>1 ? Math.round(s.cena/kol) : s.cena,
        promet: s.iznos,
        izSoljice: true,
      };
    }).filter(s=>s.prodId||s.solNaziv);

    // Ažurira stanje lokala za mapirane proizvode
    let ns = [...(data.stanjeLokala||[])];
    stavke.forEach(s => {
      if(s.prodId) {
        ns = ns.map(x => x.prodId===s.prodId&&x.lokacija===selLok
          ? {...x, kolicina: Math.max(0, x.kolicina - s.prodano)}
          : x
        );
      }
    });

    const zak = {
      id: data.nextId.zaklucak,
      lokacija: selLok,
      lokNaziv: lok.naziv,
      datum: selDate,
      vreme: nowStr(),
      smjena: "soljica",
      stavke,
      blagajna: ukupnoSol,
      ocekivaniPromet: ukupnoSol,
      razlika: 0,
      krajnjeStanje: stavke.filter(s=>s.prodId).map(s=>({prodId:s.prodId, kolicina:s.krajnje})),
      korisnik: session.ime,
      izSoljice: true,
    };

    persist(addLog(
      {...data, stanjeLokala:ns,
        zaklucakSmjene:[zak,...(data.zaklucakSmjene||[])],
        nextId:{...data.nextId, zaklucak:data.nextId.zaklucak+1}
      },
      `Uvoz iz Šoljice — ${lok.naziv}: ${ukupnoKom} kom, ${ukupnoSol.toLocaleString()} RSD`
    ));
    setUvezena(zak);
    setStep(4);
  };

  // ── STEP 1: Upload ──────────────────────────────────────────────
  if(step===1) return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{background:"#FFF8DC",border:"1px solid #E8D5A0",borderRadius:12,padding:"16px 20px",lineHeight:1.8}}>
        <b style={{fontSize:15}}>📤 Uvoz iz Šoljice — Kako radi:</b><br/>
        <span style={{fontSize:13,color:"#5A4A35"}}>
          1. U Šoljici → Izvještaji → Dnevni presek → <b>Export XLS</b><br/>
          2. Uploadujete oba fajla ovdje (Kuhinja i Šank)<br/>
          3. Sistem automatski prepozna prodane artikle<br/>
          4. Potvrđujete → stanje u lokalu se automatski ažurira ✅
        </span>
      </div>

      {/* Lokal izbor */}
      <Card title="Za koji lokal uvozite?">
        <div style={{display:"flex",gap:10}}>
          {["mama1","mama2"].map(l=>{const li=LOKALI[l];return(
            <button key={l} onClick={()=>setSelL(l)} style={{flex:1,padding:14,borderRadius:12,border:`2px solid ${selLok===l?li.boja:"#E8DECA"}`,background:selLok===l?li.bg:"white",color:li.boja,fontWeight:700,cursor:"pointer",fontSize:15}}>
              {li.icon} {li.naziv}
            </button>
          );})}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10}}>
          <label style={{fontSize:12,color:"#7A6545",fontWeight:600,margin:0}}>Datum uvoza:</label>
          <input type="date" value={selDate} max={today()} onChange={e=>setSelDate(e.target.value)} style={{...S.input,fontWeight:700,color:"#C8860A"}} />
          {selDate!==today()&&<span style={{background:"#FFF8DC",border:"1px solid #E8A020",borderRadius:8,padding:"4px 10px",fontSize:12,color:"#C8860A",fontWeight:700}}>Prošli datum</span>}
        </div>
      </Card>

      {/* Upload zona */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        {[
          {tip:"kuhinja", label:"🍳 Dnevni Kuhinja", opis:"Mantije, pite, peciva, slatkiši", boja:"#C8860A"},
          {tip:"sank",    label:"🍹 Dnevni Šank",    opis:"Pića, sokovi, mantije šank",    boja:"#1D4ED8"},
        ].map(({tip,label,opis,boja})=>(
          <label key={tip} style={{display:"block",cursor:"pointer"}}>
            <div style={{border:`2px dashed ${fajlovi[tip]?"#107C41":boja}`,borderRadius:14,padding:"24px 16px",textAlign:"center",background:fajlovi[tip]?"#E8F5E9":"white",transition:"all .2s"}}>
              <div style={{fontSize:36,marginBottom:8}}>{fajlovi[tip]?"✅":"📂"}</div>
              <div style={{fontWeight:700,fontSize:14,color:fajlovi[tip]?"#107C41":boja,marginBottom:4}}>{label}</div>
              <div style={{fontSize:12,color:"#7A6545",marginBottom:10}}>{opis}</div>
              {fajlovi[tip]
                ? <div style={{fontSize:11,color:"#107C41",fontWeight:600}}>✓ {fajlovi[tip]}<br/>{parsed[tip].length} artikala učitano</div>
                : <div style={{fontSize:11,color:"#9A8A75"}}>Kliknite ili prevucite XLS fajl</div>
              }
              <input type="file" accept=".xls,.xlsx" onChange={e=>handleFile(tip,e.target.files[0])} style={{display:"none"}}/>
            </div>
          </label>
        ))}
      </div>

      {error&&<Alert>❌ {error}</Alert>}

      {sveSolStavke.length>0&&(
        <div style={{background:"#E8F5E9",borderRadius:12,padding:"14px 18px",display:"flex",gap:20,flexWrap:"wrap"}}>
          <span style={{fontSize:13}}>📦 Ukupno artikala: <b>{sveSolStavke.length}</b></span>
          <span style={{fontSize:13}}>🛍️ Prodano: <b>{ukupnoKom} kom</b></span>
          <span style={{fontSize:13}}>💰 Promet: <b>{ukupnoSol.toLocaleString()} RSD</b></span>
        </div>
      )}

      {sveSolStavke.length>0&&(
        <Btn icon="➡️" label="Nastavi — Provjeri mapiranje" onClick={()=>setStep(2)} color="#1C1A17" full/>
      )}
    </div>
  );

  // ── STEP 2: Mapiranje ───────────────────────────────────────────
  if(step===2) return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{background:neMapirano>0?"#FFF0F0":"#E8F5E9",border:`1px solid ${neMapirano>0?"#FFCCCC":"#C8E6C9"}`,borderRadius:12,padding:"14px 18px",fontSize:13}}>
        {neMapirano>0
          ? <span>⚠️ <b>{neMapirano} artikala</b> nije automatski prepoznato — povežite ih ručno sa Mama Mantia artiklima.</span>
          : <span>✅ <b>Svi artikli automatski prepoznati!</b> Možete nastaviti.</span>
        }
      </div>

      <Card title="🔗 Mapiranje Šoljica → Mama Mantia artikli">
        <div style={{fontSize:11,color:"#7A6545",marginBottom:12}}>Sistem je automatski pokušao prepoznati artikle. Provjerite i ispravite po potrebi.</div>
        {sveSolStavke.map((s,i)=>{
          const mId = mapping[s.naziv]||"";
          const mProd = mamaProizvodi.find(p=>p.id===mId);
          return(
          <div key={i} style={{padding:"10px 12px",background:mId?"#F9FFF9":"#FFF8F5",borderRadius:8,border:`1px solid ${mId?"#C8E6C9":"#FFD5C5"}`,marginBottom:6}}>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              {/* Naziv iz Šoljice + info */}
              <div style={{minWidth:200,flex:1}}>
                <div style={{fontWeight:700,fontSize:13,color:"#1C1A17"}}>{s.naziv}</div>
                <div style={{fontSize:11,color:"#7A6545"}}>{s.izlaz} jedinica × {s.cena.toLocaleString()} RSD = <b>{s.iznos.toLocaleString()} RSD</b></div>
              </div>
              <div style={{fontSize:20,color:mId?"#107C41":"#E0A000",flexShrink:0}}>→</div>
              {/* Mama Mantia artikal */}
              <select value={mId} onChange={e=>setMapping(m=>({...m,[s.naziv]:{...(m[s.naziv]||{}),prodId:e.target.value}}))}
                style={{...S.input,flex:1,minWidth:180,background:mId?"#F0FFF0":"#FFFAF5",fontSize:12}}>
                <option value="">— Nije u Mama Mantia —</option>
                {getKat(data).map(k=>(
                  <optgroup key={k.id} label={`${k.icon} ${k.naziv}`}>
                    {k.proizvodi.map(p=><option key={p.id} value={p.id}>{p.naziv}</option>)}
                  </optgroup>
                ))}
              </select>
            </div>
            {/* Množilac red — uvijek vidljiv ako je artikal mapiran */}
            {mId&&<div style={{marginTop:8,paddingTop:8,borderTop:"1px dashed #E0D5BE",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flex:1,flexWrap:"wrap"}}>
                <span style={{fontSize:12,color:"#5A4A35",fontWeight:600}}>📦 Komada po jedinici iz Šoljice:</span>
                <input type="number" min="1" max="500"
                  value={mapping[s.naziv]?.kol||1}
                  onChange={e=>setMapping(m=>({...m,[s.naziv]:{...(m[s.naziv]||{}),kol:+e.target.value||1}}))}
                  style={{...S.input,width:70,textAlign:"center",fontWeight:700,fontSize:14}}/>
                {/* Brzi gumbi za česte vrijednosti */}
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {[1,5,10,30,60,120].map(v=>(
                    <button key={v} onClick={()=>setMapping(m=>({...m,[s.naziv]:{...(m[s.naziv]||{}),kol:v}}))}
                      style={{padding:"4px 10px",borderRadius:6,border:`1px solid ${(mapping[s.naziv]?.kol||1)===v?"#1C1A17":"#E8DECA"}`,background:(mapping[s.naziv]?.kol||1)===v?"#1C1A17":"white",color:(mapping[s.naziv]?.kol||1)===v?"white":"#5A4A35",fontSize:12,cursor:"pointer",fontWeight:(mapping[s.naziv]?.kol||1)===v?700:400}}>
                      {v=== 1?"1 kom":v===120?"Tepsija (120)":v===60?"Tepsija (60)":v===30?"Pola (30)":v+" kom"}
                    </button>
                  ))}
                </div>
              </div>
              {/* Prikaz šta to znači */}
              <div style={{background:"#FFF8DC",borderRadius:8,padding:"6px 12px",fontSize:12,color:"#5A4A35",flexShrink:0}}>
                {s.izlaz} × {mapping[s.naziv]?.kol||1} = <b style={{color:"#C8860A",fontSize:14}}>{s.izlaz*(mapping[s.naziv]?.kol||1)} kom</b> skida se sa stanja
              </div>
            </div>}
          </div>
          );
        })}
      </Card>

      <div style={{display:"flex",gap:10}}>
        <Btn icon="◀️" label="Nazad" onClick={()=>setStep(1)} color="#7A6545"/>
        <Btn icon="➡️" label="Pregled uvoza" onClick={()=>setStep(3)} color="#1C1A17" full/>
      </div>
    </div>
  );

  // ── STEP 3: Pregled ─────────────────────────────────────────────
  if(step===3) {
    const lok = LOKALI[selLok];
    const mapirano = sveSolStavke.filter(s=>mapping[s.naziv]?.prodId);
    const neMapi   = sveSolStavke.filter(s=>!mapping[s.naziv]?.prodId);
    return (
      <div style={{display:"flex",flexDirection:"column",gap:18}}>
        <div style={{background:"#FFF8DC",border:"1px solid #E8D5A0",borderRadius:12,padding:"14px 18px",fontSize:13,lineHeight:1.8}}>
          <b>📋 Pregled uvoza za {lok.icon} {lok.naziv} — {selDate}</b><br/>
          Provjerite podatke pa kliknite <b>"Potvrdi uvoz"</b>. Stanje robe u lokalu će biti ažurirano.
        </div>

        {/* Sumarni KPI */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:12}}>
          {[
            {l:"Lokacija",  v:`${lok.icon} ${lok.naziv}`, c:"#1C1A17", bg:"#FAF6EE"},
            {l:"Datum",     v:selDate,                     c:"#C8860A", bg:"#FFF8DC"},
            {l:"Prodano",   v:`${ukupnoKom} kom`,          c:"#107C41", bg:"#E8F5E9"},
            {l:"Promet",    v:`${ukupnoSol.toLocaleString()} RSD`, c:"#1D4ED8", bg:"#EFF6FF"},
            {l:"Mapirano",  v:`${mapirano.length}/${sveSolStavke.length}`, c:neMapirano>0?"#C00000":"#107C41", bg:neMapirano>0?"#FFF0F0":"#E8F5E9"},
          ].map((k,i)=>(
            <div key={i} style={{background:k.bg,borderRadius:10,padding:"12px 14px",border:`1px solid ${k.c}22`}}>
              <div style={{fontFamily:"Georgia,serif",fontSize:17,fontWeight:800,color:k.c}}>{k.v}</div>
              <div style={{fontSize:10,color:"#7A6545",marginTop:3,textTransform:"uppercase",letterSpacing:.5}}>{k.l}</div>
            </div>
          ))}
        </div>

        <Card title="📦 Artikli koji će biti uvezeni">
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead><tr style={{background:"#1C1A17"}}>
                {["Šoljica naziv","→ Mama Mantia","Jed.","× Kol","= Komada","Promet","Stanje"].map(h=><th key={h} style={S.th}>{h}</th>)}
              </tr></thead>
              <tbody>
                {mapirano.map((s,i)=>{
                  const p=mamaProizvodi.find(x=>x.id===mapping[s.naziv]?.prodId);
                  const stan=(data.stanjeLokala||[]).find(x=>x.prodId===mapping[s.naziv]&&x.lokacija===selLok);
                  const novo=Math.max(0,(stan?.kolicina||0)-s.izlaz);
                  return(
                  <tr key={i} style={{background:i%2===0?"white":"#FAF6EE"}}>
                    <td style={{...S.td,color:"#7A6545",fontSize:11}}>{s.naziv}</td>
                    <td style={{...S.td,fontWeight:700,fontSize:12}}>{p?.naziv||"?"}</td>
                    <td style={{...S.td,textAlign:"center",color:"#5A4A35"}}>{s.solIzlaz||s.prodano}</td>
                    <td style={{...S.td,textAlign:"center"}}>
                      {s.kol>1
                        ? <Tag bg="#FFF8DC" color="#C8860A">×{s.kol}</Tag>
                        : <span style={{color:"#CCC"}}>×1</span>}
                    </td>
                    <td style={{...S.td,textAlign:"center",fontWeight:800,color:"#107C41",fontSize:15}}>{s.prodano}</td>
                    <td style={{...S.td,textAlign:"right",fontWeight:700,color:"#C8860A"}}>{s.iznos.toLocaleString()}</td>
                    <td style={{...S.td,textAlign:"center"}}>
                      <span style={{color:"#7A6545"}}>{stan?.kolicina||0}</span>
                      <span style={{color:"#999",margin:"0 4px"}}>→</span>
                      <span style={{fontWeight:700,color:novo===0?"#C00000":"#107C41"}}>{novo}</span>
                    </td>
                  </tr>);
                })}
              </tbody>
              <tfoot>
                <tr style={{background:"#F5F0E8",fontWeight:700}}>
                  <td style={{...S.td}} colSpan={2}>UKUPNO</td>
                  <td style={{...S.td,textAlign:"center",fontSize:16,color:"#107C41"}}>{mapirano.reduce((s,x)=>s+x.izlaz,0)}</td>
                  <td style={S.td}></td>
                  <td style={{...S.td,textAlign:"right",fontSize:15,color:"#C8860A"}}>{mapirano.reduce((s,x)=>s+x.iznos,0).toLocaleString()} RSD</td>
                  <td style={S.td}></td>
                </tr>
              </tfoot>
            </table>
          </div>
          {neMapi.length>0&&(
            <div style={{marginTop:12,background:"#FFF8DC",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#5A4A35"}}>
              <b>ℹ️ Neuvezeni artikli</b> (nisu mapirani — biće evidentirani samo u prometu):<br/>
              {neMapi.map(s=>`${s.naziv} (${s.izlaz} kom, ${s.iznos.toLocaleString()} RSD)`).join(" · ")}
            </div>
          )}
        </Card>

        <div style={{display:"flex",gap:10}}>
          <Btn icon="◀️" label="Nazad" onClick={()=>setStep(2)} color="#7A6545"/>
          <Btn icon="✅" label={`Potvrdi uvoz — ${LOKALI[selLok].naziv}`} onClick={potvrdiUvoz} color="#107C41" full/>
        </div>
      </div>
    );
  }

  // ── STEP 4: Uspjeh ──────────────────────────────────────────────
  if(step===4&&uvezena) {
    const lok = LOKALI[uvezena.lokacija];
    const prodUk = uvezena.stavke.reduce((s,x)=>s+(x.prodano||0),0);
    return(
      <div style={{display:"flex",flexDirection:"column",gap:18,alignItems:"center",padding:"30px 20px",textAlign:"center"}}>
        <div style={{fontSize:64}}>✅</div>
        <h2 style={{fontFamily:"Georgia,serif",color:"#1C1A17",margin:0}}>Uvoz Uspješan!</h2>
        <div style={{background:"#E8F5E9",borderRadius:14,padding:"20px 30px",border:"1px solid #C8E6C9",width:"100%",maxWidth:400}}>
          <div style={{fontSize:22,fontWeight:800,color:lok.boja,marginBottom:8}}>{lok.icon} {lok.naziv}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><div style={{fontSize:22,fontWeight:800,color:"#107C41"}}>{prodUk}</div><div style={{fontSize:11,color:"#5A4A35"}}>Prodano (kom)</div></div>
            <div><div style={{fontSize:20,fontWeight:800,color:"#C8860A"}}>{ukupnoSol.toLocaleString()}</div><div style={{fontSize:11,color:"#5A4A35"}}>Promet (RSD)</div></div>
          </div>
        </div>
        <p style={{color:"#7A6545",fontSize:13,maxWidth:350}}>Stanje robe u lokalu je ažurirano. Zaključak smjene je sačuvan i vidljiv na Dashboardu i u Zaključcima.</p>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>
          <Btn icon="📤" label="Uvezi novi fajl" onClick={()=>{setStep(1);setFajlovi({kuhinja:null,sank:null});setParsed({kuhinja:[],sank:[]});setMapping({});setUvezena(null);}} color="#1C1A17"/>
        </div>
      </div>
    );
  }

  return null;
}



// ── ANALITIKA & IZVJEŠTAJI ────────────────────────────────────────
// ── PROFIT TAB ────────────────────────────────────────────────────
function ProfitTab({data, filterByPeriod, period}) {
  // Prihodi - iz evidencije
  const evid = filterByPeriod(data.evidencija||[], "datum");
  const ukPrihod = evid.reduce((s,e)=>s+(e.ukupno||0), 0);

  // Trošak sirovina iz kretanja (ULAZ = nabavka = trošak)
  const kret = filterByPeriod(data.kretanja||[], "datum");
  const ukSirovine = kret.filter(k=>k.vrsta==="ULAZ").reduce((s,k)=>s+(k.kolicina||0)*(k.cena||0), 0);

  // Fiksni troškovi
  const tros = filterByPeriod(data.troskoviMesecni||[], "datum");
  const ukTroskovi = tros.reduce((s,t)=>s+(t.iznos||0), 0);

  const ukRashod = ukSirovine + ukTroskovi;
  const profit = ukPrihod - ukRashod;
  const margin = ukPrihod>0 ? Math.round((profit/ukPrihod)*100) : 0;

  const periodLabel = {month:"30 dana","3month":"3 mj.","6month":"6 mj.",year:"Godina",all:"Sve"}[period]||period;

  // Top sirovine po trošku
  const sirovinaMap = {};
  kret.filter(k=>k.vrsta==="ULAZ").forEach(k=>{
    const key = k.naziv||k.siroId;
    if(!sirovinaMap[key]) sirovinaMap[key] = {naziv:key, iznos:0};
    sirovinaMap[key].iznos += (k.kolicina||0)*(k.cena||0);
  });
  const topSirovine = Object.values(sirovinaMap).sort((a,b)=>b.iznos-a.iznos).slice(0,5);

  // Top troškovi
  const trosMap = {};
  tros.forEach(t=>{
    const key = t.naziv||t.kategorija||"Ostalo";
    if(!trosMap[key]) trosMap[key] = {naziv:key, iznos:0};
    trosMap[key].iznos += t.iznos||0;
  });
  const topTros = Object.values(trosMap).sort((a,b)=>b.iznos-a.iznos).slice(0,5);

  const KPI = ({icon,label,value,color,bg}) => (
    <div style={{background:bg||"white",borderRadius:12,padding:"16px 18px",border:"1px solid #E8DECA",textAlign:"center"}}>
      <div style={{fontSize:28}}>{icon}</div>
      <div style={{fontSize:11,color:"#7A6545",fontWeight:600,marginTop:4}}>{label}</div>
      <div style={{fontSize:20,fontWeight:800,color:color||"#1C1A17",marginTop:4}}>{value}</div>
    </div>
  );

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>

      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#1C1A17,#2A2318)",borderRadius:14,padding:"14px 18px",display:"flex",alignItems:"center",gap:12}}>
        <div style={{fontSize:32}}>💹</div>
        <div>
          <div style={{color:"#E8A020",fontFamily:"Georgia,serif",fontSize:16,fontWeight:800}}>Profit / Gubitak</div>
          <div style={{color:"rgba(255,255,255,.5)",fontSize:12,marginTop:2}}>Period: {periodLabel}</div>
        </div>
      </div>

      {/* KPI kartice */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12}}>
        <KPI icon="💰" label="Ukupni prihod" value={fmtN(ukPrihod)} color="#107C41" bg="#F0FFF4"/>
        <KPI icon="🌾" label="Trošak sirovina" value={fmtN(ukSirovine)} color="#C00000" bg="#FFF0F0"/>
        <KPI icon="📋" label="Fiksni troškovi" value={fmtN(ukTroskovi)} color="#C8860A" bg="#FFF8DC"/>
        <KPI icon={profit>=0?"📈":"📉"} label="Profit / Gubitak" value={fmtN(profit)} color={profit>=0?"#107C41":"#C00000"} bg={profit>=0?"#F0FFF4":"#FFF0F0"}/>
        <KPI icon="%" label="Marža" value={margin+"%"} color={margin>=30?"#107C41":margin>=0?"#C8860A":"#C00000"}/>
      </div>

      {/* Pregled rashoda */}
      <Card title="📊 Pregled rashoda">
        {ukRashod===0
          ? <p style={{color:"#7A6545",fontSize:13,textAlign:"center",padding:16}}>Nema rashoda u odabranom periodu.</p>
          : (
            <div>
              {[
                {naziv:"Sirovine & nabavka", iznos:ukSirovine, boja:"#C00000", bg:"#FFF0F0"},
                {naziv:"Fiksni troškovi", iznos:ukTroskovi, boja:"#C8860A", bg:"#FFF8DC"},
              ].map(r=>(
                <div key={r.naziv} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                  <div style={{flex:1,fontSize:13,fontWeight:600}}>{r.naziv}</div>
                  <div style={{width:200,background:"#F5F0E8",borderRadius:20,height:10,overflow:"hidden"}}>
                    <div style={{width:(ukRashod>0?Math.round((r.iznos/ukRashod)*100):0)+"%",height:"100%",background:r.boja,borderRadius:20}}/>
                  </div>
                  <div style={{fontWeight:700,color:r.boja,width:80,textAlign:"right"}}>{fmtN(r.iznos)}</div>
                </div>
              ))}
            </div>
          )
        }
      </Card>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        {/* Top sirovine */}
        <Card title="🌾 Top troškovi sirovina">
          {topSirovine.length===0
            ? <p style={{color:"#7A6545",fontSize:12,padding:8}}>Nema podataka.</p>
            : topSirovine.map((s,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #F5F0E8",fontSize:13}}>
                <span>{s.naziv}</span>
                <span style={{fontWeight:700,color:"#C00000"}}>{fmtN(s.iznos)}</span>
              </div>
            ))
          }
        </Card>

        {/* Top fiksni troškovi */}
        <Card title="📋 Top fiksni troškovi">
          {topTros.length===0
            ? <p style={{color:"#7A6545",fontSize:12,padding:8}}>Nema podataka.</p>
            : topTros.map((t,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #F5F0E8",fontSize:13}}>
                <span>{t.naziv}</span>
                <span style={{fontWeight:700,color:"#C8860A"}}>{fmtN(t.iznos)}</span>
              </div>
            ))
          }
        </Card>
      </div>

    </div>
  );
}


// ── PERIODIČNI IZVJEŠTAJ ──────────────────────────────────────────
function PeriodIzvjestaj({data}) {
  const danas = today();
  const preMjesec = danas.substring(0,8) + "01";
  const [od, setOd] = useState(preMjesec);
  const [do_, setDo] = useState(danas);
  const [lokFilter, setLokFilter] = useState("sve");
  const [tip, setTip] = useState("prodaja"); // prodaja | sirovine | finansije

  const LOKALI_OPT = [
    {k:"sve",   l:"Svi lokali"},
    {k:"mama1", l:"Mama Mantia 1"},
    {k:"mama2", l:"Mama Mantia 2"},
  ];

  // Filtrirani zaključci po periodu i lokalu
  const zaklucaci = (data.zaklucakSmjene||[]).filter(z => {
    if(!z.datum) return false;
    if(z.datum < od || z.datum > do_) return false;
    if(lokFilter !== "sve" && z.lokacija !== lokFilter) return false;
    return true;
  });

  // Filtrirane dostave
  const dostave = (data.dostave||[]).filter(d => {
    if(!d.datum) return false;
    if(d.datum < od || d.datum > do_) return false;
    if(lokFilter !== "sve" && d.lokacija !== lokFilter) return false;
    return true;
  });

  // Filtrirani troškovi
  const troskovi = (data.troskovi||[]).filter(t => {
    if(!t.datum) return false;
    return t.datum >= od && t.datum <= do_;
  });

  // Filtrirane sirovine - kretanja
  const kretanja = (data.kretanja||[]).filter(k => {
    if(!k.datum) return false;
    return k.datum >= od && k.datum <= do_;
  });

  // ── Kalkulacije prodaje ──────────────────────────────────────────
  const calcProdaja = () => {
    const map = {};
    zaklucaci.forEach(z => {
      (z.stavke||[]).forEach(s => {
        if(!s.prodId || !s.prodano) return;
        if(!map[s.prodId]) map[s.prodId] = {naziv:s.naziv, kat:s.kat||"", prodano:0, promet:0};
        map[s.prodId].prodano += s.prodano||0;
        map[s.prodId].promet  += s.promet||0;
      });
    });
    return Object.values(map).sort((a,b)=>b.prodano-a.prodano);
  };

  const prodaja = calcProdaja();
  const ukPromet   = zaklucaci.reduce((s,z)=>s+(z.blagajna||0), 0);
  const ukProdano  = zaklucaci.reduce((s,z)=>s+(z.stavke||[]).reduce((ss,st)=>ss+(st.prodano||0),0), 0);
  const ukTroskovi = troskovi.reduce((s,t)=>s+(t.iznos||0), 0);
  const ukNabavka  = kretanja.filter(k=>k.vrsta==="ULAZ").reduce((s,k)=>s+(k.kolicina||0)*(k.cena||0), 0);
  const ukProfit   = ukPromet - ukTroskovi - ukNabavka;
  const brSmjena   = zaklucaci.length;

  // ── Print funkcija ───────────────────────────────────────────────
  const printIzvjestaj = () => {
    const lokNaziv = lokFilter==="sve" ? "Svi lokali" : LOKALI[lokFilter]?.naziv || lokFilter;
    const prodRows = prodaja.map(p =>
      "<tr><td style='padding:5px 8px;border-bottom:1px solid #eee'>" + p.naziv + "</td>" +
      "<td style='padding:5px 8px;border-bottom:1px solid #eee;text-align:center'>" + p.prodano + "</td>" +
      "<td style='padding:5px 8px;border-bottom:1px solid #eee;text-align:right'>" + (p.promet||0).toLocaleString() + " RSD</td></tr>"
    ).join("");

    const win = window.open("","_blank","width=900,height=800");
    win.document.write("<!DOCTYPE html><html><head><meta charset='UTF-8'/><title>Izvjestaj</title>" +
      "<style>body{font-family:'Segoe UI',sans-serif;margin:0;padding:24px;color:#1C1A17}" +
      "h1{font-family:Georgia,serif;margin:0 0 4px}" +
      ".logo{font-family:Georgia,serif;font-size:26px;font-weight:700;font-style:italic}" +
      ".logo span{color:#C8860A}" +
      ".header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #E8A020;padding-bottom:14px;margin-bottom:20px}" +
      ".kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}" +
      ".kpi-box{background:#f9f7f2;border:1px solid #e8d5a0;border-radius:10px;padding:12px;text-align:center}" +
      ".kpi-val{font-size:18px;font-weight:800;font-family:Georgia,serif}" +
      ".kpi-lbl{font-size:10px;color:#7A6545;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}" +
      "table{width:100%;border-collapse:collapse;font-size:13px}" +
      "thead tr{background:#1C1A17;color:white}" +
      "th{padding:8px;text-align:left;font-size:11px}" +
      ".section{margin-bottom:24px}" +

function Analitika({data}) {
  const [tab,    setTab]    = useState("prodaja");
  const [period, setPeriod] = useState("month"); // month | 3month | 6month | year | all
  const [selGod, setSelGod] = useState(new Date().getFullYear());
  const [datumOd, setDatumOd] = useState("");
  const [datumDo, setDatumDo] = useState("");

  // ── Helpers ──────────────────────────────────────────────────────
  const months = ["Jan","Feb","Mar","Apr","Maj","Jun","Jul","Aug","Sep","Okt","Nov","Dec"];

  const filterByPeriod = (arr, dateField) => {
    if(period==="custom" && datumOd && datumDo) {
      return arr.filter(x => x[dateField] >= datumOd && x[dateField] <= datumDo);
    }
    const now = new Date();
    const cutoff = new Date();
    if(period==="month")       cutoff.setDate(now.getDate()-30);
    else if(period==="3month") cutoff.setDate(now.getDate()-90);
    else if(period==="6month") cutoff.setDate(now.getDate()-180);
    else if(period==="year")   cutoff.setFullYear(now.getFullYear()-1);
    else return arr;
    return arr.filter(x => new Date(x[dateField]) >= cutoff);
  };

  const periodLabel = {month:"Zadnjih 30 dana", "3month":"Zadnja 3 mj.", "6month":"Zadnjih 6 mj.", year:"Zadnja godina", all:"Sve vrijeme"}[period];

  // ── Tab: Prodaja po artiklu ───────────────────────────────────────
  const calcProdaja = () => {
    const zaklucaci = filterByPeriod(data.zaklucakSmjene||[], "datum");
    const map = {}; // prodId → {naziv, kat, prodano, promet, brZaklucaka}
    zaklucaci.forEach(z => {
      (z.stavke||[]).forEach(s => {
        if(!s.prodId || !s.prodano) return;
        if(!map[s.prodId]) map[s.prodId] = {naziv:s.naziv, kat:s.kat||"—", prodano:0, promet:0, br:0};
        map[s.prodId].prodano += s.prodano||0;
        map[s.prodId].promet  += s.promet||0;
        map[s.prodId].br++;
      });
    });
    return Object.entries(map)
      .map(([id,v])=>({...v, id, prosjecno: v.br>0?Math.round(v.prodano/v.br):0}))
      .sort((a,b)=>b.prodano-a.prodano);
  };

  // ── Tab: Prodaja po mjesecu ───────────────────────────────────────
  const calcMjesecnaProdaja = () => {
    const zaklucaci = data.zaklucakSmjene||[];
    const map = {}; // "YYYY-MM" → {blagajna, ocekivani, prodano}
    zaklucaci.forEach(z => {
      if(!z.datum) return;
      const key = z.datum.substring(0,7);
      if(!map[key]) map[key] = {mjesec:key, blagajna:0, promet:0, prodano:0, br:0};
      map[key].blagajna += z.blagajna||0;
      map[key].promet   += z.ocekivaniPromet||0;
      map[key].prodano  += (z.stavke||[]).reduce((s,x)=>s+(x.prodano||0),0);
      map[key].br++;
    });
    return Object.values(map).sort((a,b)=>a.mjesec.localeCompare(b.mjesec));
  };

  // ── Tab: Potrošnja sirovina ───────────────────────────────────────
  const calcSirovine = () => {
    const kretanja = filterByPeriod((data.kretanja||[]).filter(k=>k.vrsta==="IZLAZ"), "datum");
    const map = {};
    kretanja.forEach(k => {
      if(!map[k.siroId]) map[k.siroId] = {naziv:k.naziv, kolicina:0, vrednost:0, br:0};
      map[k.siroId].kolicina += k.kolicina||0;
      map[k.siroId].vrednost += k.vrednost||0;
      map[k.siroId].br++;
    });
    // Also check ulaz (otpremnice) for avg monthly purchase
    const ulaz = filterByPeriod((data.kretanja||[]).filter(k=>k.vrsta==="ULAZ"), "datum");
    const ulazMap = {};
    ulaz.forEach(k => {
      if(!ulazMap[k.siroId]) ulazMap[k.siroId] = {kolicina:0, vrednost:0};
      ulazMap[k.siroId].kolicina += k.kolicina||0;
      ulazMap[k.siroId].vrednost += k.vrednost||0;
    });
    const sir = data.sirovine||[];
    return sir.map(s => ({
      id:s.id, naziv:s.naziv, jm:s.jm,
      potroseno: map[s.id]?.kolicina||0,
      vrednostPotrosnje: map[s.id]?.vrednost||0,
      nabavljeno: ulazMap[s.id]?.kolicina||0,
      vrednostNabavke: ulazMap[s.id]?.vrednost||0,
      trenutno: s.kolicina||0,
    })).filter(s=>s.potroseno>0||s.nabavljeno>0)
      .sort((a,b)=>b.potroseno-a.potroseno);
  };

  // ── Tab: Potrošnja po mjesecu (sirovine) ─────────────────────────
  const calcMjesecneSirovine = () => {
    const kretanja = data.kretanja||[];
    const map = {}; // "YYYY-MM" → {ulaz_vr, izlaz_vr, ulaz_kol, izlaz_kol}
    kretanja.forEach(k => {
      if(!k.datum) return;
      const key = k.datum.substring(0,7);
      if(!map[key]) map[key] = {mjesec:key, nabavka:0, potrosnja:0, nabKol:0, potKol:0};
      if(k.vrsta==="ULAZ")  { map[key].nabavka+=k.vrednost||0; map[key].nabKol+=k.kolicina||0; }
      if(k.vrsta==="IZLAZ") { map[key].potrosnja+=k.vrednost||0; map[key].potKol+=k.kolicina||0; }
    });
    return Object.values(map).sort((a,b)=>a.mjesec.localeCompare(b.mjesec));
  };

  // ── Tab: Lokali usporedba ─────────────────────────────────────────
  const calcLokali = () => {
    const zaklucaci = filterByPeriod(data.zaklucakSmjene||[], "datum");
    const res = {};
    Object.keys(LOKALI).filter(l=>l!=="proizvodnja").forEach(l => {
      const lok = LOKALI[l];
      const zak = zaklucaci.filter(z=>z.lokacija===l);
      const prodano = zak.reduce((s,z)=>(z.stavke||[]).reduce((ss,st)=>ss+(st.prodano||0),0)+s, 0);
      const promet  = zak.reduce((s,z)=>s+(z.blagajna||0), 0);
      const manjak  = zak.filter(z=>z.razlika<-50).length;
      const visak   = zak.filter(z=>z.razlika>50).length;
      res[l] = {naziv:lok.naziv, icon:lok.icon, boja:lok.boja, bg:lok.bg, prodano, promet, manjak, visak, brSmjena:zak.length};
    });
    return Object.values(res);
  };

  const prodaja    = calcProdaja();
  const mj_prodaja = calcMjesecnaProdaja();
  const sirovine   = calcSirovine();
  const mj_sir     = calcMjesecneSirovine();
  const lokali     = calcLokali();

  const ukupnoPromet  = mj_prodaja.reduce((s,x)=>s+x.blagajna,0);
  const ukupnoProdano = prodaja.reduce((s,x)=>s+x.prodano,0);
  const prosjecniMj   = mj_prodaja.length>0 ? Math.round(ukupnoPromet/mj_prodaja.length) : 0;

  const barMax = (arr, field) => { const vals = arr.map(x=>x[field]||0); vals.push(1); return Math.max.apply(null, vals); };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>

      {/* Period selector */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:12,color:"#7A6545",fontWeight:600,marginRight:4}}>Period:</span>
        {[
          {k:"month",  l:"30 dana"},
          {k:"3month", l:"3 mj."},
          {k:"6month", l:"6 mj."},
          {k:"year",   l:"Godina"},
          {k:"all",    l:"Sve"},
        ].map(p=>(
          <button key={p.k} onClick={()=>{setPeriod(p.k);setDatumOd("");setDatumDo("");}}
            style={{padding:"6px 14px",borderRadius:20,border:"1.5px solid "+(period===p.k&&period!=="custom"?"#1C1A17":"#E8DECA"),
              background:period===p.k&&period!=="custom"?"#1C1A17":"white",color:period===p.k&&period!=="custom"?"white":"#5A4A35",
              fontSize:12,fontWeight:period===p.k&&period!=="custom"?700:400,cursor:"pointer"}}>
            {p.l}
          </button>
        ))}
        <span style={{fontSize:11,color:"#7A6545",marginLeft:8}}>Od:</span>
        <input type="date" value={datumOd} onChange={e=>{setDatumOd(e.target.value);if(e.target.value)setPeriod("custom");}}
          style={{padding:"4px 8px",border:"1.5px solid "+(period==="custom"?"#C8860A":"#E8DECA"),borderRadius:8,fontSize:12,background:period==="custom"?"#FFF8DC":"white",cursor:"pointer"}}/>
        <span style={{fontSize:11,color:"#7A6545"}}>Do:</span>
        <input type="date" value={datumDo} onChange={e=>{setDatumDo(e.target.value);if(e.target.value)setPeriod("custom");}}
          style={{padding:"4px 8px",border:"1.5px solid "+(period==="custom"?"#C8860A":"#E8DECA"),borderRadius:8,fontSize:12,background:period==="custom"?"#FFF8DC":"white",cursor:"pointer"}}/>
        {period==="custom"&&<button onClick={()=>{setPeriod("month");setDatumOd("");setDatumDo("");}}
          style={{padding:"4px 10px",borderRadius:20,border:"1px solid #FFCCCC",background:"#FFF0F0",color:"#C00000",fontSize:11,cursor:"pointer"}}>✕ Resetuj</button>}
        <span style={{fontSize:11,color:"#9A8A75",marginLeft:4}}>— {period==="custom"&&datumOd&&datumDo?datumOd+" → "+datumDo:periodLabel}</span>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:0,background:"white",borderRadius:12,padding:5,border:"1px solid #E8DECA",alignSelf:"flex-start",flexWrap:"wrap",gap:3}}>
        {[
          {k:"prodaja",   l:"🛍️ Prodaja po artiklu"},
          {k:"mjeseci",   l:"📅 Mjesečni promet"},
          {k:"sirovine",  l:"🌾 Potrošnja sirovina"},
          {k:"lokali",    l:"🏪 Lokali usporedba"},
          {k:"profit",    l:"💹 Profit / Gubitak"},
        ].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)}
            style={{padding:"8px 14px",borderRadius:8,border:"none",
              background:tab===t.k?"#1C1A17":"transparent",
              color:tab===t.k?"white":"#5A4A35",
              fontWeight:tab===t.k?700:400,cursor:"pointer",fontSize:12}}>
            {t.l}
          </button>
        ))}
      </div>

      {/* ── TAB: Prodaja po artiklu ── */}
      {tab==="prodaja"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {prodaja.length===0

      {/* ── TAB: Potrošnja sirovina ── */}
      {tab==="sirovine"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>

            : <>
              <Card title={`🌾 Potrošnja sirovina — ${periodLabel}`}>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead><tr style={{background:"#1C1A17"}}>
                      {["Sirovina","JM","Nabavljeno","Potrošeno","Na stanju","Vrijednost pot."].map(h=><th key={h} style={S.th}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {sirovine.map((s,i)=>{
                        const pct = Math.round((s.potroseno/barMax(sirovine,"potroseno"))*100);
                        return(
                        <tr key={s.id} style={{background:i%2===0?"white":"#FAF6EE"}}>
                          <td style={{...S.td,fontWeight:700}}>{s.naziv}</td>
                          <td style={{...S.td,color:"#7A6545"}}>{s.jm}</td>
                          <td style={{...S.td,textAlign:"right",color:"#1565C0",fontWeight:700}}>{fmtN(s.nabavljeno)}</td>
                          <td style={{...S.td}}>

                              <div style={{flex:1,height:12,background:"#F0EBE0",borderRadius:6,overflow:"hidden"}}>
                                <div style={{width:`${pct}%`,height:"100%",background:"linear-gradient(90deg,#A07010,#C8860A)",borderRadius:6}}/>
                              </div>
                              <span style={{fontWeight:800,minWidth:36,textAlign:"right"}}>{fmtN(s.potroseno)}</span>
                            </div>
                          </td>
                          <td style={{...S.td,textAlign:"center"}}>
                            <span style={{fontWeight:700,color:s.trenutno<(data.sirovine||[]).find(x=>x.id===s.id)?.min?"#C00000":"#107C41"}}>{fmtN(s.trenutno)}</span>
                          </td>
                          <td style={{...S.td,textAlign:"right",color:"#C8860A"}}>{s.vrednostPotrosnje>0?fmtN(s.vrednostPotrosnje)+" RSD":"—"}</td>
                        </tr>);
                      })}
                    </tbody>
                  </table>
                </div>
              </Card>

              {/* Mjesečna potrošnja sirovina */}
              {mj_sir.length>0&&(
                <Card title="📅 Nabavka vs. Potrošnja sirovina po miesecu">
                  <div style={{display:"flex",alignItems:"flex-end",gap:6,height:140,marginBottom:12,overflowX:"auto",paddingBottom:8}}>
                    {mj_sir.map(m=>{
                      const _sirVals = mj_sir.map(x=>Math.max(x.nabavka,x.potrosnja)); _sirVals.push(1); const mx = Math.max.apply(null, _sirVals);
                      const hN = Math.round((m.nabavka/mx)*120);
                      const hP = Math.round((m.potrosnja/mx)*120);
                      const [yr,mo] = m.mjesec.split("-");
                      return(
                        <div key={m.mjesec} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:"0 0 auto",minWidth:52}}>
                          <div style={{display:"flex",alignItems:"flex-end",gap:2,height:124}}>
                            <div title="Nabavka" style={{width:18,height:Math.max(hN,4),background:"#1565C0",borderRadius:"3px 3px 0 0",opacity:.8}}/>
                            <div title="Potrošnja" style={{width:18,height:Math.max(hP,4),background:"#C8860A",borderRadius:"3px 3px 0 0",opacity:.8}}/>
                          </div>
                          <div style={{fontSize:9,color:"#7A6545",textAlign:"center",lineHeight:1.2}}>{months[parseInt(mo)-1]}<br/>{yr.slice(2)}</div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{display:"flex",gap:16,fontSize:11,color:"#7A6545",marginBottom:8}}>
                    <span><span style={{display:"inline-block",width:12,height:12,background:"#1565C0",borderRadius:2,marginRight:4}}/>Nabavka RSD</span>
                    <span><span style={{display:"inline-block",width:12,height:12,background:"#C8860A",borderRadius:2,marginRight:4}}/>Potrošnja RSD</span>
                  </div>
                </Card>
              )}
            </>
          }
        </div>
      )}

      {/* ── TAB: Lokali usporedba ── */}
      {tab==="lokali"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14}}>
            {lokali.map(l=>(
              <div key={l.naziv} style={{background:"white",borderRadius:14,border:`2px solid ${l.boja}33`,overflow:"hidden"}}>
                <div style={{background:l.boja,padding:"14px 18px",display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:28}}>{l.icon}</span>
                  <div>
                    <div style={{color:"white",fontWeight:800,fontSize:17}}>{l.naziv}</div>
                    <div style={{color:"rgba(255,255,255,.6)",fontSize:11}}>{l.brSmjena} smjena u periodu</div>
                  </div>
                </div>
                <div style={{padding:16}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                    <div style={{background:l.bg,borderRadius:10,padding:"10px 12px",textAlign:"center"}}>
                      <div style={{fontFamily:"Georgia,serif",fontSize:20,fontWeight:800,color:l.boja}}>{fmtN(l.prodano)}</div>
                      <div style={{fontSize:10,color:"#7A6545"}}>Prodano (kom)</div>
                    </div>
                    <div style={{background:"#FFF8DC",borderRadius:10,padding:"10px 12px",textAlign:"center"}}>
                      <div style={{fontFamily:"Georgia,serif",fontSize:18,fontWeight:800,color:"#C8860A"}}>{fmtN(l.promet)}</div>

                    </div>
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    {l.manjak>0&&<Tag bg="#FFF0F0" color="#C00000">⚠️ {l.manjak}× manjak</Tag>}
                    {l.visak>0&&<Tag bg="#EFF6FF" color="#1565C0">💙 {l.visak}× višak</Tag>}
                    {l.manjak===0&&l.visak===0&&l.brSmjena>0&&<Tag bg="#E8F5E9" color="#107C41">✅ Sve tačno</Tag>}

                </div>
              </div>

          {lokali.length>0&&(
            <Card title="📊 Usporedba lokala">
              <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}><table style={{width:"100%",minWidth:500,borderCollapse:"collapse",fontSize:13}}>
                <thead><tr style={{background:"#1C1A17"}}>
                  {["Lokal","Prodano","Promet","Prosj./smjeni","Tačnost blagajne"].map(h=><th key={h} style={S.th}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {lokali.map((l,i)=>{
                    const tacnost = l.brSmjena>0 ? Math.round(((l.brSmjena-l.manjak-l.visak)/l.brSmjena)*100) : 100;
                    return(
                    <tr key={l.naziv} style={{background:i%2===0?"white":"#FAF6EE"}}>
                      <td style={{...S.td,fontWeight:700}}><span style={{color:l.boja}}>{l.icon}</span> {l.naziv}</td>
                      <td style={{...S.td,textAlign:"center",fontWeight:800,color:"#107C41"}}>{fmtN(l.prodano)}</td>
                      <td style={{...S.td,textAlign:"right",fontWeight:700,color:"#C8860A"}}>{fmtN(l.promet)} RSD</td>
                      <td style={{...S.td,textAlign:"right",color:"#5A4A35"}}>{l.brSmjena>0?fmtN(Math.round(l.promet/l.brSmjena))+" RSD":"—"}</td>
                      <td style={{...S.td,textAlign:"center"}}>
                        <span style={{fontWeight:700,color:tacnost>=90?"#107C41":tacnost>=70?"#C8860A":"#C00000"}}>{tacnost}%</span>
